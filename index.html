<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protocolo Vermelho</title>
<meta name="description" content="Reserva de emergência da família: quantos dias vocês aguentam sem abastecimento">
<meta name="theme-color" content="#0B0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Protocolo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0B0A0A;--bg2:#121010;--card:#181515;--card2:#201C1C;--line:#2C2626;
  --fg:#F4F1EE;--fg2:#B8AFAA;--fg3:#7C7470;
  --red:#E3262D;--red2:#A9151A;--red-soft:rgba(227,38,45,.14);
  --green:#5BC94B;--yellow:#F2C230;--orange:#F08A24;--blue:#3BA3F5;
  --nav-h:64px;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:'Barlow',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.wrap{max-width:600px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 96px)}
.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif}

/* header */
.hhdr{position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
.hhdr-art{position:absolute;inset:0;pointer-events:none}
.hhdr-art svg{position:absolute;right:0;bottom:0;height:100%;width:100%}
.hhdr-art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 22%,rgba(11,10,10,.6) 50%,rgba(11,10,10,0) 78%),linear-gradient(0deg,var(--bg) 0%,rgba(11,10,10,0) 34%)}
.hhdr-in{position:relative;display:flex;align-items:center;gap:14px;max-width:600px;margin:0 auto;padding:20px var(--gr) 34px var(--gl)}
.hhdr-logo{width:74px;height:auto;filter:drop-shadow(0 4px 16px rgba(227,38,45,.35))}
.brand{display:flex;flex-direction:column;border-left:2px solid rgba(255,255,255,.85);padding-left:14px;line-height:.92}
.brand b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:29px;letter-spacing:.5px;text-transform:uppercase}
.brand b.r{color:var(--red);font-size:37px}
.brand span{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:13px;letter-spacing:.6em;margin-top:7px;color:#E9E4E0}
.gear{margin-left:auto;align-self:flex-start;width:44px;height:44px;border-radius:12px;background:rgba(20,18,18,.72);border:1px solid var(--line);display:grid;place-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.bar{position:sticky;top:0;z-index:20;background:rgba(11,10,10,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar-in{display:flex;align-items:center;gap:10px;height:56px;max-width:600px;margin:0 auto;padding:0 var(--gr) 0 var(--gl)}
.bar-in img{width:30px;height:auto}
.bar-in h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:40px;height:40px;display:grid;place-items:center;margin-left:-10px}

/* cards & sections */
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px}
.sec h2{font-size:19px;font-weight:600;display:flex;align-items:center;gap:10px}
.sec h2::before{content:"";width:5px;height:22px;border-radius:3px;background:var(--red)}
.lnk{color:var(--red);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:2px}
.lnk svg.i{width:18px;height:18px}

.prep{display:flex;gap:16px;align-items:center;padding:18px;margin-top:-10px;position:relative;width:100%;text-align:left}
.ring{position:relative;width:100px;height:100px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:27px;font-weight:700}
.prep-tx{flex:1;min-width:0}
.prep-tx h3{font-size:19px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:6px}
.prep-tx p{color:var(--fg2);font-size:14px;margin:2px 0 10px}
.trk{display:block;width:100%;flex-shrink:0;height:8px;border-radius:5px;background:#2E2929;overflow:hidden}
.trk i{display:block;height:100%;border-radius:5px}
.meta{display:flex;align-items:center;gap:6px;color:var(--fg3);font-size:12.5px;margin-top:9px}
.meta svg.i{width:16px;height:16px}

.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px 12px;font-size:13px;font-weight:500;text-align:center;line-height:1.2}
.qa svg.i{width:27px;height:27px}

.fam{position:relative;overflow:hidden;margin-top:18px;border:1px solid rgba(227,38,45,.55);background:linear-gradient(100deg,#3D0B0E 0%,#290A0B 52%,#1A0A0A 100%);border-radius:18px}
.fam-img{position:absolute;right:0;top:0;bottom:0;width:44%;background:url(kit.webp) center/cover;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.fam-tag{position:relative;display:inline-flex;align-items:center;gap:8px;background:var(--red2);padding:8px 16px 8px 14px;border-radius:0 0 16px 0;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:15px;letter-spacing:.4px;text-transform:uppercase}
.fam-tag svg.i{width:19px;height:19px}
.fam-body{position:relative;padding:12px 18px 18px;max-width:66%}
.fam-body h3{font-size:21px;font-weight:700;line-height:1.15;text-wrap:balance}
.fam-body p{font-size:13.5px;color:#E6DCD8;margin:6px 0 14px}
.btn-red{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;font-weight:600;padding:11px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(227,38,45,.32)}
.btn-red svg.i{width:18px;height:18px}

.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:520px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cat{padding:14px;text-align:left;display:flex;flex-direction:column;gap:7px;min-width:0}
.cat-top{display:flex;align-items:center;gap:9px;min-width:0}
.cat-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.05);flex-shrink:0}
.cat-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-val{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:27px;line-height:1}
.cat-val small{font-size:15px;font-weight:600;color:var(--fg2);margin-left:3px}
.cat-sub{font-size:12px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-4px}
.cat-miss{font-size:13px;font-weight:600}
.need{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.need:last-child{border-bottom:0}
.need-tx{flex:1;min-width:0}
.need-tx b{display:block;font-weight:600;font-size:14.5px}
.need-tx span{display:block;font-size:12.5px;color:var(--fg3)}
.need-q{font-weight:700;white-space:nowrap;text-align:right}
button.cfg-r{width:100%;text-align:left;color:var(--fg)}
label.cfg-r{cursor:pointer}
.cfg-r>svg.i{color:var(--fg3)}
.pdf-ok{text-align:center;padding:10px 0 4px}
.pdf-ok>svg.i{width:44px;height:44px;color:var(--green);margin-bottom:8px}
.pdf-ok p{color:var(--fg2);font-size:14px;margin-bottom:14px}
.col{display:grid;gap:10px}

.act{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left}
.act-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.act-ic.ok{background:var(--green);color:#0B0A0A}
.act-ic.bad{background:var(--red);color:#fff}
.act-tx{flex:1;min-width:0}
.act-tx b{display:block;font-weight:600}
.act-tx span{display:block;color:var(--fg2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-t{color:var(--fg3);font-size:12.5px;white-space:nowrap}

/* nav + fab */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,16,16,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:flex;max-width:600px;margin:0 auto;height:var(--nav-h);padding:0 var(--gr) 0 var(--gl)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--fg3);font-size:12.5px;font-weight:500;position:relative}
.nav button.on{color:var(--red)}
.nav button.on::before{content:"";position:absolute;top:-1px;width:44px;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
.badge{position:absolute;top:7px;left:calc(50% + 5px);background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:9px;line-height:1.4}
.fab{position:fixed;z-index:25;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);width:58px;height:58px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(227,38,45,.4)}
.fab svg.i{width:28px;height:28px;stroke-width:2.4}
@media(min-width:640px){.fab{right:calc(50% - 300px + 12px)}}

/* stock */
.tools{display:flex;gap:8px;margin-top:14px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-width:0;color:var(--fg3)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:11px 0;color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--fg2)}
.pill svg.i{width:17px;height:17px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px var(--gr) 4px var(--gl);margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg2);font-size:13px;font-weight:500;white-space:nowrap}
.chip svg.i{width:16px;height:16px}
.chip.on{background:var(--red-soft);border-color:var(--red);color:#fff}
.chip em{font-style:normal;color:var(--fg3);font-size:12px}
.grp{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--fg3);margin:20px 2px 8px;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:8px;width:100%;text-align:left}
.row-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.05);flex-shrink:0}
.row-tx{flex:1;min-width:0}
.row-tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-tx span{display:block;font-size:12.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-ex{font-size:12.5px;text-align:right;white-space:nowrap;color:var(--fg3)}
.row.exp{border-color:rgba(227,38,45,.65);background:linear-gradient(180deg,#2B1213,#1E1011)}
.row.soon{border-color:rgba(240,138,36,.55)}
.empty{text-align:center;padding:36px 20px;color:var(--fg2)}
.empty svg.i{width:44px;height:44px;color:var(--fg3);margin-bottom:10px}
.empty h3{color:var(--fg);font-size:17px;margin-bottom:4px}
.empty p{font-size:14px;margin-bottom:16px}

/* family */
.cfg{padding:4px 16px}
.cfg-r{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.cfg-r:last-child{border-bottom:0}
.cfg-l{flex:1;min-width:0}
.cfg-l b{display:block;font-weight:600}
.cfg-l span{font-size:12.5px;color:var(--fg3)}
.step{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;flex-shrink:0}
.step button{width:40px;height:40px;display:grid;place-items:center;color:var(--fg2)}
.step button svg.i{width:18px;height:18px}
.step output{min-width:34px;text-align:center;font-weight:700;font-size:17px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;flex-shrink:0}
.seg button{padding:6px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--fg2)}
.seg button.on{background:var(--red);color:#fff}
.how{padding:16px;font-size:13.5px;color:var(--fg2)}
.how li{margin:0 0 6px 18px}
.how b{color:var(--fg)}

/* detail */
.big{padding:18px;margin-top:16px}
.big-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.big-top .cat-ic{width:48px;height:48px;border-radius:14px}
.big-top .cat-ic svg.i{width:26px;height:26px}
.big-val{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:40px;line-height:1}
.big-val small{font-size:18px;color:var(--fg2);font-weight:600;margin-left:4px}
.facts{list-style:none;margin-top:14px;display:grid;gap:8px;font-size:14px;color:var(--fg2)}
.facts li{display:flex;gap:8px}
.facts li b{color:var(--fg);font-weight:600}
.facts svg.i{width:18px;height:18px;margin-top:1px;color:var(--fg3)}
.chk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk-ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.chk-ic svg.i{width:16px;height:16px;stroke-width:3}
.chk-ic.y{background:var(--green);color:#0B0A0A}
.chk-ic.n{border:2px solid #4A4242}
.chk span{flex:1;min-width:0}
.mini{font-size:13px;font-weight:600;color:var(--red);padding:6px 10px;border:1px solid rgba(227,38,45,.5);border-radius:999px;white-space:nowrap}
.trow{padding:12px 14px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow-h{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px;font-size:14px}
.trow-h b{font-weight:600}
.note{font-size:12.5px;color:var(--fg3);margin-top:10px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:600px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .28s cubic-bezier(.3,1,.3,1);padding:0 var(--gr) calc(20px + env(safe-area-inset-bottom,0px)) var(--gl)}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:#3A3333;margin:10px auto 4px}
.sh-h{display:flex;align-items:center;gap:6px;padding:8px 0 14px}
.sh-h h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.4px;flex:1}
.sh-h .back{margin-left:-10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:15px;margin-bottom:10px;text-align:left}
.opt .cat-ic{width:44px;height:44px;border-radius:12px;color:var(--red)}
.opt b{display:block;font-weight:600}
.opt span{font-size:13px;color:var(--fg2)}
.cl-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;border-radius:10px;text-align:left}
.cl-item:active{background:var(--card2)}
.cl-item span{flex:1;min-width:0}
.cl-item em{font-style:normal;font-size:12px;color:var(--fg3)}
.fld{margin-bottom:13px}
.fld>label{display:block;font-size:13px;font-weight:600;color:var(--fg2);margin-bottom:5px}
.inp{width:100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:0;color:var(--fg);color-scheme:dark;-webkit-appearance:none;appearance:none}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--fg3) 50%),linear-gradient(135deg,var(--fg3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.inp:focus{border-color:var(--red)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px}
.withbtn{display:flex;gap:8px}
.ibtn{width:48px;flex-shrink:0;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg)}
.hint{font-size:12px;color:var(--fg3);margin-top:5px}
.calc{font-size:13px;color:var(--green);margin:-4px 0 12px;min-height:18px}
.btns{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:13px;border-radius:12px;font-weight:700;text-align:center}
.btn.p{background:var(--red);color:#fff}
.btn.s{background:var(--card);border:1px solid var(--line);color:var(--fg2)}
.btn.d{border:1px solid rgba(227,38,45,.6);color:var(--red);margin-top:12px;width:100%}

/* camera */
.cam{position:fixed;inset:0;z-index:100;background:#000}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-box{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(84vw,380px);height:84px;border:2px solid #fff;border-radius:10px;box-shadow:0 0 0 200vmax rgba(0,0,0,.5)}
.cam-box.bc{height:150px;border-color:var(--red)}
.cam-box.bc::after{content:"";position:absolute;left:8px;right:8px;height:2px;top:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:sl 1.6s ease-in-out infinite}
@keyframes sl{0%,100%{top:12%}50%{top:86%}}
.cam-top{position:absolute;top:0;left:0;right:0;padding:calc(16px + env(safe-area-inset-top,0px)) 24px 30px;text-align:center;color:#fff;font-weight:600;font-size:15px;background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,0))}
.cam-top small{display:block;font-weight:400;font-size:13px;opacity:.8;margin-top:3px}
.cam-btns{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 16px}
.cam-btns button{padding:13px 22px;border-radius:999px;font-weight:700;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cam-btns button.p{background:var(--red);border-color:var(--red)}

/* ================= STATE ================= */
const KEY_S='pv_stock',KEY_C='pv_cfg';
const DEF={adults:1,children:0,elderly:0,dogs:0,dogSize:'M',cats:0,target:15,alert:30,_ok:false};
const S={stock:[],cfg:{...DEF},view:'home',arg:null,q:'',fcat:'',sort:'expiry'};
let sheetMode=null,formData={},editingId=null,presetCat='',delArmed=false,catQ='';

const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const $=s=>document.querySelector(s);

const CATMAP={graos:'alimento',proteina:'alimento',conserva:'alimento',bebidas:'alimento',alimento:'alimento',agua:'agua',saude:'saude',higiene:'higiene',energia:'energia',pet:'pet',outros:'ferramentas',ferramentas:'ferramentas'};
function migrate(){
  const out=[],seen=new Set();
  const push=i=>{
    const it={id:i.id||uid(),name:String(i.name||'Item').trim(),cat:CATMAP[i.cat]||'outros',qty:+i.qty||1,
      unit:i.unit==='pac'?'pct':(i.unit||'un'),expiry:i.expiry||'',barcode:i.barcode||'',notes:i.notes||'',
      ts:i.ts||Date.parse(i.addedDate||'')||Date.now()};
    if(i.portionDays!=null)it.portionDays=i.portionDays;
    const key=norm(it.name)+'|'+it.expiry+'|'+it.qty+'|'+it.unit;
    if(seen.has(key))return;seen.add(key);out.push(it);
  };
  try{const v2=JSON.parse(localStorage.getItem('dp_stock')||'null');if(Array.isArray(v2))v2.forEach(push);}catch(e){}
  try{
    const v1=JSON.parse(localStorage.getItem('despensa72h_v1')||'null');
    if(v1){
      (v1.stock||[]).forEach(push);
      const names=new Set(out.map(i=>norm(i.name)));
      (v1.shopping||[]).filter(s=>s.done).forEach(s=>{
        const nm=String(s.name).replace(/ \(.*?\)$/,'').replace(/ —.*$/,'').trim();
        if(names.has(norm(nm)))return;
        names.add(norm(nm));push({name:nm,cat:s.cat,qty:s.qty,unit:s.unit,expiry:''});
      });
    }
  }catch(e){}
  return out;
}
function load(){
  let imported=0;
  try{
    const s=localStorage.getItem(KEY_S);
    if(s)S.stock=JSON.parse(s)||[];
    else{S.stock=migrate();imported=S.stock.length;}
    const c=localStorage.getItem(KEY_C);
    if(c)S.cfg={...DEF,...JSON.parse(c)};
    else{
      const o=JSON.parse(localStorage.getItem('dp_cfg')||'null');
      if(o)S.cfg={...DEF,adults:o.adults||1,children:o.children||0,elderly:o.elderly||0,dogs:o.hasPet?1:0,target:o.targetDays||15,alert:o.alertDays||30,_ok:!!o._ok};
    }
  }catch(e){}
  if(imported){save();setTimeout(()=>toast(`${imported} itens trazidos da versão anterior`),600);}
}
function save(){try{localStorage.setItem(KEY_S,JSON.stringify(S.stock));localStorage.setItem(KEY_C,JSON.stringify(S.cfg));}catch(e){}}

/* ================= DATES ================= */
const todayISO=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
function dLeft(exp){if(!exp)return Infinity;return Math.round((new Date(exp+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/864e5);}
const isExp=e=>!!e&&dLeft(e)<0;
const isSoon=e=>{const d=dLeft(e);return isFinite(d)&&d>=0&&d<=S.cfg.alert;};
function fDate(s){if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function expTxt(e){if(!e)return'sem validade';const d=dLeft(e);if(d<0)return`venceu há ${-d} d`;if(d===0)return'vence hoje';if(d===1)return'vence amanhã';if(d<=45)return`vence em ${d} d`;return fDate(e);}
function ago(ts){const s=(Date.now()-ts)/1e3;if(s<60)return'agora';if(s<3600)return`há ${Math.floor(s/60)} min`;if(s<86400)return`há ${Math.floor(s/3600)}h`;return`há ${Math.floor(s/86400)}d`;}
function whenTxt(ts){if(!ts)return'—';const d=new Date(ts),t=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});const days=Math.floor((new Date(todayISO()+'T00:00:00')-new Date(d.toDateString()))/864e5);if(days<=0)return`hoje às ${t}`;if(days===1)return`ontem às ${t}`;return`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} às ${t}`;}

/* ================= CALCULATIONS ================= */
const look=(tab,n,def)=>{for(const[r,v]of tab)if(r.test(n))return v;return def;};
function parseSize(name){const m=String(name).match(/(\d+(?:[.,]\d+)?)\s*(kg|g|l|ml)\b/i);if(!m)return 0;const v=parseFloat(m[1].replace(',','.'));const u=m[2].toLowerCase();return(u==='g'||u==='ml')?v/1000:v;}
function liters(i){
  if(VOL[i.unit])return i.qty*VOL[i.unit];
  const n=norm(i.name);
  if(PURIF.test(n))return 0;
  const s=parseSize(i.name);if(s)return i.qty*s;
  if(i.portionDays)return i.qty*i.portionDays*3;
  if(/gal/.test(n)||/gal/.test(norm(i.unit)))return i.qty*20;
  return i.qty*1.5;
}
function kcal(i){
  const n=norm(i.name),q=i.qty||0;
  if(MASS[i.unit])return q*MASS[i.unit]*look(DENS,n,3000);
  if(i.k!=null)return q*i.k;
  const s=parseSize(i.name);if(s)return q*s*look(DENS,n,3000);
  if(i.portionDays)return q*i.portionDays*2000;
  const u=norm(i.unit);
  return q*look(PERUN,n,u==='lata'?220:/^(pct|pac)/.test(u)?1200:u==='cx'?600:250);
}
function pieces(i){
  if(PIECES[i.unit])return i.qty*PIECES[i.unit];
  const m=String(i.name).match(/(\d+)\s*(rolos|unidades|un)\b/i);
  if(m&&/^(pct|pac|cx|fardo)/i.test(i.unit))return i.qty*+m[1];
  return i.qty;
}
const isPetFood=i=>/racao|petisco|sache|alimento/.test(norm(i.name))||!!MASS[i.unit];
function petKg(i){if(MASS[i.unit])return{kg:i.qty*MASS[i.unit],est:false};const s=parseSize(i.name);if(s)return{kg:i.qty*s,est:false};return{kg:i.qty*3,est:true};}
const eff=c=>Math.max(.5,c.adults+c.children*.6+c.elderly*.8);
const heads=c=>Math.max(1,c.adults+c.children+c.elderly);

function stats(){
  const c=S.cfg,T=c.target,E=eff(c),H=heads(c);
  const ok=S.stock.filter(i=>!isExp(i.expiry));
  const by=k=>ok.filter(i=>i.cat===k);
  const R={T,E,H};
  const L=by('agua').reduce((s,i)=>s+liters(i),0),Ld=NEED.water*E;
  R.agua={days:L/Ld,L,Ld,pur:ok.some(i=>PURIF.test(norm(i.name)))};
  const K=by('alimento').reduce((s,i)=>s+kcal(i),0),Kd=NEED.kcal*E;
  R.alimento={days:K/Kd,K,Kd};
  const tr=HYG.map(h=>{const p=ok.filter(i=>h.r.test(norm(i.name))).reduce((s,i)=>s+pieces(i),0);return{...h,have:p,days:p/(h.need*H)};});
  const lim=tr.reduce((a,b)=>b.days<a.days?b:a);
  R.higiene={days:lim.days,tracks:tr,lim};
  if(c.dogs||c.cats){
    let dk=0,ck=0,est=false;
    ok.filter(i=>i.cat==='pet'&&isPetFood(i)).forEach(i=>{const r=petKg(i);est=est||r.est;if(/gato|felin/.test(norm(i.name)))ck+=r.kg;else dk+=r.kg;});
    const dn=c.dogs*(NEED.dog[c.dogSize]||.3),cn=c.cats*NEED.cat,ds=[];
    if(c.dogs)ds.push(dk/dn);if(c.cats)ds.push(ck/cn);
    R.pet={days:Math.min(...ds),dk,ck,dn,cn,est};
  }
  ['saude','energia','ferramentas'].forEach(k=>{
    const list=ESS[k].map(e=>({l:e[0],add:[e[2],e[3]],has:ok.some(i=>e[1].test(norm(i.name)))}));
    const have=list.filter(e=>e.has).length;
    R[k]={list,have,tot:list.length,pct:have/list.length};
  });
  R.auton=Math.min(R.agua.days,R.alimento.days);
  R.limit=R.agua.days<=R.alimento.days?'agua':'alimento';
  const sc=['agua','alimento','higiene'].map(k=>Math.min(R[k].days/T,1)).concat(['saude','energia','ferramentas'].map(k=>R[k].pct));
  if(R.pet)sc.push(Math.min(R.pet.days/T,1));
  R.prep=sc.reduce((a,b)=>a+b,0)/sc.length;
  return R;
}
const dCol=(d,T)=>d<3?'var(--red)':d<7?'var(--orange)':d<T?'var(--yellow)':'var(--green)';
const pCol=p=>p>=1?'var(--green)':p>=.5?'var(--yellow)':'var(--red)';
const fN=(n,dig=1)=>(+n).toLocaleString('pt-BR',{maximumFractionDigits:dig});
const fD=d=>!isFinite(d)?'—':(d>0&&d<1)?'<1':String(Math.floor(d));
const plural=(n,a,b)=>n===1?a:b;
function catVal(k,R){
  const T=R.T;
  if(CATS[k].t==='days'){const d=R[k].days;return{v:`${fD(d)}<small>${Math.floor(d)===1?'dia':'dias'}</small>`,p:Math.min(d/T,1),col:dCol(d,T)};}
  const r=R[k];return{v:r.have===r.tot?'Completo':`${r.have}<small>/ ${r.tot}</small>`,p:r.pct,col:pCol(r.pct)};
}
const KCAL_KG=3500;
function gap(k,R){
  const T=R.T,f=v=>Math.max(0,+v.toFixed(3));
  if(k==='agua')return f(T*R.agua.Ld-R.agua.L);
  if(k==='alimento')return f(T*R.alimento.Kd-R.alimento.K);
  if(k==='pet'){const p=R.pet;return f(p.dn*T-p.dk)+f(p.cn*T-p.ck);}
  return 0;
}
const trackGap=(t,R)=>Math.max(0,Math.ceil(+(t.need*R.H*R.T-t.have).toFixed(3)));
const SHORT={papel:'rolos de papel',sab:'sabonetes',dent:'cremes dentais'};
function catMiss(k,R){
  const T=R.T;
  if(CATS[k].t==='days'){
    const d=R[k].days;
    if(d>=T-1e-6){const s={agua:`${fN(R.agua.L)} L em estoque`,alimento:`${fN(R.alimento.K/1000,0)} mil kcal em estoque`,higiene:'papel, sabonete e creme dental ok',pet:R.pet?`${fN(R.pet.dk+R.pet.ck)} kg de ração`:''}[k];return{m:'Meta atingida',col:'var(--green)',s};}
    const n=Math.ceil(T-d);let s='';
    if(k==='agua')s=`+${fN(Math.ceil(gap(k,R)))} L de água`;
    else if(k==='alimento')s=`+${fN(gap(k,R)/KCAL_KG,1)} kg de comida`;
    else if(k==='pet')s=`+${fN(gap(k,R),1)} kg de ração`;
    else if(k==='higiene'){const t=R.higiene.lim;s=`+${trackGap(t,R)} ${SHORT[t.k]}`;}
    return{m:`Faltam ${n} ${plural(n,'dia','dias')}`,col:dCol(d,T),s};
  }
  const r=R[k],n=r.tot-r.have;
  if(!n)return{m:'Todos os essenciais',col:'var(--green)',s:`${r.tot} de ${r.tot} itens`};
  return{m:`Faltam ${n} ${plural(n,'item','itens')}`,col:pCol(r.pct),s:`ex.: ${r.list.find(e=>!e.has).l.toLowerCase()}`};
}
function shopping(R,full){
  const T=R.T,out=[];
  const w=gap('agua',R);
  if(w>0)out.push({cat:'agua',l:'Água potável',q:`${fN(Math.ceil(w))} L`,h:`≈ ${Math.ceil(w/20)} ${plural(Math.ceil(w/20),'galão','galões')} de 20 L ou ${Math.ceil(w/5)} garrafas de 5 L`,act:"addPreset('Galão de água 20 L','agua','galão 20 L')"});
  if(!R.agua.pur)out.push({cat:'agua',l:'Hipoclorito 2,5% (purificar água)',q:'1 frasco',act:"addPreset('Hipoclorito 2,5% (purificar água)','agua','un')"});
  const k=gap('alimento',R);
  if(k>0){const kg=k/KCAL_KG;out.push({cat:'alimento',l:'Comida não perecível',q:`${fN(k/1000,0)} mil kcal`,h:`≈ ${fN(kg*2/3,1)} kg de arroz + ${fN(kg/3,1)} kg de feijão, ou equivalente`,act:"openAdd('alimento','catalog')"});}
  R.higiene.tracks.forEach(t=>{const m=trackGap(t,R);if(m>0)out.push({cat:'higiene',l:t.l,q:`${m} ${t.u}`,h:t.why,act:`addPreset('${t.add[0]}','higiene','${t.add[1]}')`});});
  if(R.pet){const p=R.pet,d=Math.max(0,+(p.dn*T-p.dk).toFixed(3)),c=Math.max(0,+(p.cn*T-p.ck).toFixed(3));
    if(d>0)out.push({cat:'pet',l:'Ração para cão',q:`${fN(d,1)} kg`,act:"addPreset('Ração para cão','pet','sc 10 kg')"});
    if(c>0)out.push({cat:'pet',l:'Ração para gato',q:`${fN(c,1)} kg`,act:"addPreset('Ração para gato','pet','sc 3 kg')"});}
  ['saude','energia','ferramentas'].forEach(cat=>{
    const miss=R[cat].list.filter(e=>!e.has);if(!miss.length)return;
    if(full)miss.forEach(e=>out.push({cat,l:e.l,q:'1',h:CATS[cat].l}));
    else out.push({cat,l:`${CATS[cat].l}: faltam ${miss.length} ${plural(miss.length,'item','itens')}`,q:'ver',h:miss.slice(0,3).map(e=>e.l.toLowerCase()).join(', ')+(miss.length>3?'…':''),act:`go('cat','${cat}')`});
  });
  return out;
}
const visibleCats=R=>['agua','alimento','higiene','saude','energia','ferramentas'].concat(R.pet?['pet']:[]);

/* ================= RENDER ================= */
function go(v,arg){S.view=v;S.arg=arg??null;render();window.scrollTo(0,0);}
function render(){

  $('#main').innerHTML=(views[S.view]||vHome)(R);

  $('#nav').innerHTML=[['home','home','Início'],['stock','list','Estoque'],['alerts','bell','Alertas'],['family','users','Família']]
    .map(([v,i,l])=>`<button class="${tab===v?'on':''}" onclick="go('${v}')" aria-label="${l}">${ic(i)}<span>${l}</span>${v==='alerts'&&n?`<span class="badge">${n>9?'9+':n}</span>`:''}</button>`).join('');
}
function art(){
  let seed=11;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  let p='';
  for(let k=0;k<17;k++){const x=168+k*15.5+rnd()*9,h=30+rnd()*50,b=200,w=h*.3;let d='';
    for(let t=0;t<4;t++){const top=b-h+t*h*.19,bot=top+h*.36,ww=w*(.42+t*.2);d+=`M${x.toFixed(1)} ${top.toFixed(1)}L${(x+ww).toFixed(1)} ${bot.toFixed(1)}H${(x-ww).toFixed(1)}Z`;}
    p+=`<path d="${d}M${(x-1.2).toFixed(1)} ${(b-h*.2).toFixed(1)}h2.4V${b}h-2.4z"/>`;}
  return`<svg viewBox="0 0 420 200" preserveAspectRatio="xMaxYMax slice" aria-hidden="true"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120707"/><stop offset=".55" stop-color="#4E100E"/><stop offset="1" stop-color="#8A1B13"/></linearGradient><radialGradient id="sun"><stop offset="0" stop-color="#FF7350"/><stop offset=".75" stop-color="#E2321F"/><stop offset="1" stop-color="#B5221A"/></radialGradient><radialGradient id="glow"><stop offset="0" stop-color="#FF4A2A" stop-opacity=".5"/><stop offset="1" stop-color="#FF4A2A" stop-opacity="0"/></radialGradient></defs><rect width="420" height="200" fill="url(#sky)"/><circle cx="312" cy="112" r="115" fill="url(#glow)"/><circle cx="312" cy="112" r="48" fill="url(#sun)"/><path d="M120 150 170 86 200 112 250 52 300 118 330 98 372 140 400 110 420 124V200H120Z" fill="#3A0F0E" opacity=".92"/><path d="M120 172 160 146 200 160 248 126 290 162 330 142 380 166 420 150V200H120Z" fill="#1C0909"/><g fill="#0A0606">${p}</g></svg>`;
}
function hdrHome(){
  return`<header class="hhdr"><div class="hhdr-art">${art()}</div><div class="hhdr-in"><img class="hhdr-logo" src="logo.png" alt="Protocolo Vermelho"><div class="brand"><b>Protocolo</b><b class="r">Vermelho</b><span>FAMILIAR</span></div><button class="gear" onclick="go('family')" aria-label="Família e configurações">${ic('gear')}</button></div></header>`;

  const t={stock:'Estoque',alerts:'Alertas',family:'Família',cat:S.arg&&CATS[S.arg]?CATS[S.arg].l:''}[S.view]||'';

/* ---- Início ---- */

  return h;

function famLine(c){

function qtyTxt(i){let t=`${fN(i.qty)} ${i.unit}`;if(i.cat==='agua'&&i.unit!=='L'){const l=liters(i);if(l)t+=` · ${fN(l)} L`;}return t;}

    a.tracks.forEach(t=>{h+=`<div class="trow"><div class="trow-h"><b>${t.l}</b><span>${fN(t.have)} ${t.u} → <b style="color:${dCol(t.days,T)}">${fD(t.days)} dias</b></span></div><div class="trk"><i style="width:${Math.min(t.days/T,1)*100}%;background:${dCol(t.days,T)}"></i></div><div class="hint">${t.why}${t.have?'':` · <button class="lnk" style="font-size:12.5px" onclick="addPreset('${t.add[0]}','higiene','${t.add[1]}')">+ adicionar</button>`}</div></div>`;});
    h+=`</div>`;}
  else if(k==='pet'){
    if(!R.pet){h+=`<div class="card empty">${ic('paw')}<h3>Nenhum pet cadastrado</h3><p>Informe cães e gatos na aba Família para calcular a ração.</p><button class="btn-red" onclick="go('family')">${ic('users')}Ir para Família</button></div>`;}
    else{const a=R.pet,c=S.cfg;
      h+=head(`${fD(a.days)}<small>dias</small>`,Math.min(a.days/T,1),dCol(a.days,T),`de ração · meta ${T} dias`)+`<ul class="facts">
      ${c.dogs?li('paw',`Cães: <b>${fN(a.dk)} kg</b> para ${fN(a.dn*1000,0)} g/dia → <b>${fD(a.dk/a.dn)} dias</b>`):''}
      ${c.cats?li('paw',`Gatos: <b>${fN(a.ck)} kg</b> para ${fN(a.cn*1000,0)} g/dia → <b>${fD(a.ck/a.cn)} dias</b>`):''}
      </ul>${a.est?'<p class="note">Algum saco de ração está sem peso — estimei 3 kg. Edite o item e escolha a unidade com o peso (ex.: sc 10 kg).</p>':''}</div>`;}}
  else if(R[k]&&R[k].list){const a=R[k];
    h+=head(a.have===a.tot?'Completo':`${a.have}<small>/ ${a.tot}</small>`,a.pct,pCol(a.pct),`essenciais de ${C.l.toLowerCase()}`)+`</div><div class="sec"><h2>Essenciais</h2></div><div class="card">`;
    a.list.forEach(e=>{h+=`<div class="chk"><span class="chk-ic ${e.has?'y':'n'}">${e.has?ic('check'):''}</span><span>${e.l}</span>${e.has?'':`<button class="mini" onclick="addPreset('${esc(e.add[0])}','${k}','${e.add[1]}')">+ Adicionar</button>`}</div>`;});
    h+=`</div>`;}
  const items=S.stock.filter(i=>i.cat===k).sort(sortFn);
  h+=`<div class="sec"><h2>Itens em ${C.l.toLowerCase()}</h2><button class="lnk" onclick="openAdd('${k}')">${ic('plus')}Adicionar</button></div>`;
  h+=items.length?items.map(rowHtml).join(''):`<div class="card empty" style="padding:24px">${ic(C.ic)}<p style="margin:0">Nenhum item nesta categoria ainda.</p></div>`;
  return h;
}

/* ---- Estoque ---- */
function sortFn(a,b){
  if(S.sort==='name')return a.name.localeCompare(b.name,'pt-BR');
  const ea=a.expiry||'9999',eb=b.expiry||'9999';
  return ea===eb?a.name.localeCompare(b.name,'pt-BR'):ea.localeCompare(eb);
}
function rowHtml(i){
  const C=CATS[i.cat]||CATS.outros,ex=isExp(i.expiry),so=!ex&&isSoon(i.expiry);
  const col=ex?'var(--red)':so?(dLeft(i.expiry)<=7?'var(--red)':'var(--orange)'):'var(--fg3)';
  return`<button class="card row ${ex?'exp':so?'soon':''}" onclick="editItem('${i.id}')"><span class="row-ic">${ic(C.ic,`color:${C.c}`)}</span><span class="row-tx"><b>${esc(i.name)}</b><span>${qtyTxt(i)}</span></span><span class="row-ex" style="color:${col}">${expTxt(i.expiry)}</span></button>`;
}
function vStock(){
  const counts={};S.stock.forEach(i=>counts[i.cat]=(counts[i.cat]||0)+1);
  let h=`<div class="tools"><label class="search">${ic('search')}<input type="search" placeholder="Buscar item…" value="${esc(S.q)}" oninput="S.q=this.value;drawList()" aria-label="Buscar item"></label><button class="pill" onclick="S.sort=S.sort==='expiry'?'name':'expiry';drawList();this.lastChild.textContent=S.sort==='expiry'?'Validade':'Nome'">${ic('sort')}<span>${S.sort==='expiry'?'Validade':'Nome'}</span></button></div>`;
  h+=`<div class="chips"><button class="chip ${S.fcat?'':'on'}" onclick="S.fcat='';render()">Todos <em>${S.stock.length}</em></button>`;
  CAT_ORDER.forEach(k=>{if(!counts[k]&&k==='outros')return;h+=`<button class="chip ${S.fcat===k?'on':''}" onclick="S.fcat='${k}';render()">${ic(CATS[k].ic,`color:${CATS[k].c}`)}${CATS[k].l} <em>${counts[k]||0}</em></button>`;});
  h+=`</div><div id="list">${listHtml()}</div>`;
  return h;
}
function listHtml(){
  if(!S.stock.length)return`<div class="card empty" style="margin-top:14px">${ic('box')}<h3>Estoque vazio</h3><p>Registre o que vocês têm em casa — com a quantidade e a validade.</p><button class="btn-red" onclick="openAdd()">${ic('plus')}Adicionar item</button></div>`;
  const q=norm(S.q);
  const items=S.stock.filter(i=>(!S.fcat||i.cat===S.fcat)&&(!q||norm(i.name).includes(q))).sort(sortFn);
  if(!items.length)return`<div class="empty">Nenhum item encontrado.</div>`;
  if(S.sort==='expiry'&&!S.fcat)return`<div class="grp"><span>Por validade</span><span>${items.length}</span></div>`+items.map(rowHtml).join('');
  let h='';
  CAT_ORDER.forEach(k=>{const g=items.filter(i=>i.cat===k);if(!g.length)return;h+=`<div class="grp"><span>${CATS[k].l}</span><span>${g.length}</span></div>`+g.map(rowHtml).join('');});
  return h;
}
function drawList(){const l=$('#list');if(l)l.innerHTML=listHtml();}

/* ---- Alertas ---- */
function vAlerts(){
  const ex=S.stock.filter(i=>isExp(i.expiry)).sort(sortByExp);
  const s7=S.stock.filter(i=>!isExp(i.expiry)&&isSoon(i.expiry)&&dLeft(i.expiry)<=7).sort(sortByExp);
  const sN=S.stock.filter(i=>!isExp(i.expiry)&&isSoon(i.expiry)&&dLeft(i.expiry)>7).sort(sortByExp);
  if(!ex.length&&!s7.length&&!sN.length)return`<div class="card empty" style="margin-top:16px">${ic('check')}<h3>Tudo dentro da validade</h3><p>Nada vence nos próximos ${S.cfg.alert} dias.</p></div>`;
  let h='';
  if(ex.length)h+=`<div class="grp"><span style="color:var(--red)">Vencidos — não contam na autonomia</span><span>${ex.length}</span></div>`+ex.map(rowHtml).join('');
  if(s7.length)h+=`<div class="grp"><span style="color:var(--orange)">Vencem em até 7 dias</span><span>${s7.length}</span></div>`+s7.map(rowHtml).join('');
  if(sN.length)h+=`<div class="grp"><span>Vencem em até ${S.cfg.alert} dias</span><span>${sN.length}</span></div>`+sN.map(rowHtml).join('');
  return h+`<p class="note" style="text-align:center">Dica: consuma os que estão perto de vencer e reponha com lotes novos.</p>`;
}
const sortByExp=(a,b)=>a.expiry.localeCompare(b.expiry);

/* ---- Família ---- */

function setCfg(k,d,min,max){S.cfg[k]=Math.max(min,Math.min(max,(S.cfg[k]||0)+d));if(k==='adults'&&!S.cfg.adults&&!S.cfg.elderly)S.cfg.adults=1;S.cfg._ok=true;save();render();}

/* ================= ADD / EDIT SHEET ================= */
function openSheet(){$('#scrim').classList.add('on');$('#sheet').classList.add('on');}
function closeSheet(){$('#scrim').classList.remove('on');$('#sheet').classList.remove('on');sheetMode=null;}
function openAdd(cat,mode){presetCat=cat||'';editingId=null;delArmed=false;formData={cat:presetCat||''};catQ='';sheetMode=mode||'menu';if(sheetMode==='form'&&!formData.cat)formData.cat='alimento';drawSheet();openSheet();}
function addPreset(name,cat,unit){editingId=null;delArmed=false;formData={name,cat,unit,qty:''};sheetMode='form';drawSheet();openSheet();}
function editItem(id){const it=S.stock.find(i=>i.id===id);if(!it)return;editingId=id;delArmed=false;formData={...it};sheetMode='form';drawSheet();openSheet();}
function setSheet(m){if(sheetMode==='form')readForm();sheetMode=m;drawSheet();$('#sheet').scrollTop=0;}
function shHead(title,back){return`<div class="sh-h">${back?`<button class="back" onclick="setSheet('${back}')" aria-label="Voltar">${ic('chevL')}</button>`:''}<h3>${title}</h3><button class="back" onclick="closeSheet()" aria-label="Fechar" style="margin-right:-10px">${ic('x')}</button></div>`;}
function drawSheet(){
  const b=$('#sb');

    b.innerHTML=shHead(presetCat?`Adicionar em ${CATS[presetCat].l.toLowerCase()}`:'Adicionar item')+

       <button class="card opt" onclick="setSheet('catalog')"><span class="cat-ic">${ic('rows')}</span><span><b>Escolher do catálogo</b><span>Itens recomendados para emergência</span></span></button>
       <button class="card opt" onclick="formData={cat:presetCat||'alimento'};setSheet('form')"><span class="cat-ic">${ic('pen')}</span><span><b>Digitar manualmente</b><span>Qualquer item que não esteja na lista</span></span></button>`;
  }else if(sheetMode==='catalog'){
    b.innerHTML=shHead('Catálogo','menu')+`<label class="search" style="margin-bottom:10px">${ic('search')}<input type="search" placeholder="Buscar no catálogo…" value="${esc(catQ)}" oninput="catQ=this.value;$('#cl').innerHTML=catalogHtml()" aria-label="Buscar no catálogo"></label><div id="cl">${catalogHtml()}</div>`;
  }else if(sheetMode==='ean'){
    b.innerHTML=shHead('Código de barras','menu')+`<p style="color:var(--fg2);font-size:14px;margin-bottom:12px">Não foi possível usar a câmera. Digite os números do código de barras:</p><div class="withbtn"><input class="inp" id="ean" inputmode="numeric" placeholder="ex.: 7891000100103" value="${esc(formData.barcode||'')}"><button class="btn p" style="flex:0 0 auto;padding:11px 18px" onclick="gotCode($('#ean').value.trim(),true)">Buscar</button></div><div class="btns" style="margin-top:16px"><button class="btn s" onclick="setSheet('form')">Preencher sem código</button></div>`;
  }else if(sheetMode==='loading'){
    b.innerHTML=shHead('Buscando produto')+`<div class="empty"><span class="spin" style="border-color:#3A3333;border-top-color:var(--red)"></span>Consultando o código ${esc(formData.barcode||'')}…</div>`;
  }else if(sheetMode==='form'){
    b.innerHTML=shHead(editingId?'Editar item':'Novo item',editingId?'':'menu')+formHtml();
    updCalc();
  }else if(sheetMode==='pdf'){
    let body;
    if(pdf.err)body=`<div class="pdf-ok">${ic('alert','color:var(--red)')}<p>Não consegui gerar o PDF. Na primeira vez é preciso estar com internet para baixar o gerador.</p><button class="btn p" style="width:100%" onclick="openPdf()">Tentar de novo</button></div>`;
    else if(!pdf.file)body=`<div class="empty"><span class="spin" style="border-color:#3A3333;border-top-color:var(--red)"></span>Montando o relatório…</div>`;
    else{const canShare=!!(navigator.canShare&&navigator.canShare({files:[pdf.file]}));

    b.innerHTML=shHead('Relatório em PDF')+body;
  }else if(sheetMode==='import'){

function catalogHtml(){
  const q=norm(catQ);
  const list=CATALOG.filter(e=>(!presetCat||q||e.c===presetCat)&&(!q||norm(e.n).includes(q)));
  if(!list.length)return`<div class="empty">Nada encontrado. <button class="lnk" onclick="formData={name:catQ,cat:presetCat||'alimento'};setSheet('form')">Cadastrar “${esc(catQ)}”</button></div>`;
  let h='';
  CAT_ORDER.forEach(k=>{const g=list.filter(e=>e.c===k);if(!g.length)return;
    h+=`<div class="grp"><span>${CATS[k].l}</span></div>`+g.map(e=>`<button class="cl-item" onclick="pickCat(${CATALOG.indexOf(e)})">${ic(CATS[k].ic,`color:${CATS[k].c}`)}<span>${esc(e.n)}</span>${e.ess?'<em>essencial</em>':''}${ic('plus','color:var(--red)')}</button>`).join('');});
  if(presetCat&&!q)h+=`<button class="lnk" style="margin:14px 0 4px" onclick="presetCat='';$('#cl').innerHTML=catalogHtml()">Ver catálogo completo${ic('chevR')}</button>`;
  return h;
}
function pickCat(ix){const e=CATALOG[ix];formData={name:e.n,cat:e.c,unit:e.u,qty:''};if(e.k!=null)formData.k=e.k;setSheet('form');setTimeout(()=>{const q=$('#f-qty');if(q)q.focus();},320);}
function unitOpts(cat,cur){const l=[...(UNITS[cat]||UNITS.outros)];if(cur&&!l.includes(cur))l.unshift(cur);return l.map(u=>`<option ${u===cur?'selected':''}>${esc(u)}</option>`).join('');}
function formHtml(){
  const f=formData,cat=f.cat||'alimento';
  return`<form id="f" onsubmit="event.preventDefault();submitItem()" novalidate>
   <div class="fld"><label for="f-name">Produto</label><input class="inp" id="f-name" value="${esc(f.name||'')}" placeholder="ex.: Arroz tipo 1" maxlength="80" autocomplete="off" oninput="updCalc()"></div>

   <div class="two"><div class="fld"><label for="f-qty">Quantidade</label><input class="inp" id="f-qty" type="number" inputmode="decimal" min="0" step="any" value="${f.qty===''||f.qty==null?'':f.qty}" placeholder="0" oninput="updCalc()"></div>

   <div class="fld"><label for="f-bc">Código de barras</label><div class="withbtn"><input class="inp" id="f-bc" inputmode="numeric" value="${esc(f.barcode||'')}" placeholder="opcional"><button type="button" class="ibtn" onclick="openScan()" aria-label="Escanear código de barras">${ic('scan')}</button></div></div>
   <div class="fld"><label for="f-notes">Observações</label><input class="inp" id="f-notes" value="${esc(f.notes||'')}" placeholder="opcional — marca, onde está guardado…"></div>
   <div class="btns"><button type="button" class="btn s" onclick="closeSheet()">Cancelar</button><button type="submit" class="btn p">${editingId?'Salvar':'Adicionar'}</button></div>
   ${editingId?`<button type="button" class="btn d" id="del" onclick="delItem()">Excluir item</button>`:''}
  </form>`;

function readForm(){
  if(!$('#f'))return;
  Object.assign(formData,{name:$('#f-name').value.trim(),cat:$('#f-cat').value,qty:$('#f-qty').value,unit:$('#f-unit').value,expiry:$('#f-exp').value,barcode:$('#f-bc').value.trim(),notes:$('#f-notes').value.trim()});
}
function updCalc(){
  const el=$('#calc');if(!el)return;
  const q=parseFloat(($('#f-qty').value||'').replace(',','.'));
  if(!(q>0)){el.textContent='';return;}
  const it={name:$('#f-name').value,cat:$('#f-cat').value,qty:q,unit:$('#f-unit').value,k:formData.k};
  const c=S.cfg,E=eff(c),H=heads(c);let t='';
  if(it.cat==='agua'){const l=liters(it);if(l)t=`= ${fN(l)} L · cerca de ${fD(l/(NEED.water*E))} dias de água para a família`;}
  else if(it.cat==='alimento'){const k=kcal(it);if(k)t=`≈ ${fN(k,0)} kcal · cerca de ${fD(k/(NEED.kcal*E))} dias de comida para a família`;}
  else if(it.cat==='higiene'){const h=HYG.find(x=>x.r.test(norm(it.name)));if(h){const p=pieces(it);t=`= ${fN(p)} ${h.u} · cerca de ${fD(p/(h.need*H))} dias`;}}
  else if(it.cat==='pet'&&(c.dogs||c.cats)&&isPetFood(it)){const r=petKg(it);const need=/gato|felin/.test(norm(it.name))?c.cats*NEED.cat:c.dogs*(NEED.dog[c.dogSize]||.3);if(need)t=`${r.est?'≈':'='} ${fN(r.kg)} kg · cerca de ${fD(r.kg/need)} dias de ração`;}
  el.textContent=t;
}
function submitItem(){
  readForm();
  const f=formData,q=parseFloat(String(f.qty).replace(',','.'));
  if(!f.name){toast('Informe o nome do produto');$('#f-name').focus();return;}
  if(!(q>0)){toast('Informe a quantidade');$('#f-qty').focus();return;}
  const base=editingId?S.stock.find(i=>i.id===editingId)||{}:{};
  const it={...base,id:editingId||uid(),name:f.name,cat:f.cat,qty:q,unit:f.unit,expiry:f.expiry||'',barcode:f.barcode||'',notes:f.notes||'',ts:Date.now()};
  if(f.k!=null)it.k=f.k;
  if(editingId){it.edited=true;S.stock=S.stock.map(i=>i.id===editingId?it:i);toast('Item atualizado');}
  else{S.stock.push(it);toast('Item adicionado');}
  save();closeSheet();render();
}

function loadScript(u){return scripts[u]||(scripts[u]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>{delete scripts[u];no(new Error('load'));};document.head.appendChild(s);}));}

function stopStream(){
  if(cam.timer){clearInterval(cam.timer);cam.timer=null;}
  if(cam.reader){try{cam.reader.reset();}catch(e){}cam.reader=null;}
  const v=$('#cam video');
  if(v&&v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null;}
  if(cam.stream){cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null;}
}
function closeCam(){stopStream();$('#cam').hidden=true;$('#cam').innerHTML='';cam.mode=null;}
async function startVideo(hi){

  cam.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:hi?1920:1280},height:{ideal:hi?1080:720}}});

/* barcode */
async function openScan(){
  if(sheetMode==='form')readForm();
  else{if(sheetMode!=='menu')presetCat='';formData={cat:presetCat};editingId=null;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showEan();return;}
  camShell('bc');
  camUI('Aponte para o código de barras<small>Segure firme, a uns 15 cm do produto</small>',`<button onclick="closeCam()">Cancelar</button><button onclick="closeCam();showEan()">Digitar código</button>`);
  try{
    let fmts=[];
    if('BarcodeDetector' in window){try{fmts=await BarcodeDetector.getSupportedFormats();}catch(e){}}
    const want=['ean_13','ean_8','upc_a','upc_e','code_128'].filter(f=>fmts.includes(f));
    if(want.length){
      const v=await startVideo(false);const det=new BarcodeDetector({formats:want});
      cam.timer=setInterval(async()=>{if(cam.busy||v.readyState<2)return;try{const r=await det.detect(v);if(r[0])gotCode(r[0].rawValue);}catch(e){}},220);
      return;
    }
    $('#cam-top').innerHTML='<span class="spin"></span>Preparando leitor…';
    await loadScript(ZXING_URL);
    if(cam.mode!=='bc')return;
    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128]);
    cam.reader=new ZXing.BrowserMultiFormatReader(hints,250);
    $('#cam-top').innerHTML='Aponte para o código de barras<small>Segure firme, a uns 15 cm do produto</small>';
    await cam.reader.decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'}}},$('#cam video'),res=>{if(res&&!cam.busy)gotCode(res.getText());});
  }catch(e){
    closeCam();
    toast(e&&e.name==='NotAllowedError'?'Permita o uso da câmera nas configurações do navegador':'Não foi possível abrir a câmera');
    showEan();
  }
}
function showEan(){if(sheetMode!=='form')formData={cat:presetCat||''};sheetMode='ean';drawSheet();openSheet();}
async function gotCode(code,typed){
  code=String(code||'').replace(/\D/g,'');
  if(!code){toast('Código inválido');return;}
  if(cam.busy)return;cam.busy=true;
  if(!typed){if(navigator.vibrate)navigator.vibrate(60);closeCam();}
  const wasForm=sheetMode==='form'||(sheetMode==='ean'&&formData.name);
  formData.barcode=code;
  const known=S.stock.find(i=>i.barcode===code);
  if(known&&!editingId){
    formData={...formData,name:formData.name||known.name,cat:known.cat,unit:known.unit,qty:'',barcode:code};if(known.k!=null)formData.k=known.k;
    toast('Produto já cadastrado — informe a quantidade deste lote');
    sheetMode='form';drawSheet();openSheet();cam.busy=false;return;
  }
  if(wasForm&&formData.name){sheetMode='form';drawSheet();openSheet();cam.busy=false;return;}
  sheetMode='loading';drawSheet();openSheet();
  const p=await lookupOFF(code);
  if(p){formData.name=formData.name||p.name;if(!formData.cat||(!wasForm&&!presetCat))formData.cat=p.cat;if(p.brand&&!formData.notes)formData.notes=`Marca: ${p.brand}`;toast('Produto encontrado');}
  else{formData.cat=formData.cat||presetCat||'alimento';toast('Produto não encontrado na base — preencha o nome');}
  sheetMode='form';drawSheet();cam.busy=false;
}
async function lookupOFF(code){
  try{
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),7000);
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}?fields=product_name,product_name_pt,brands,quantity,categories_tags`,{signal:ctl.signal});
    clearTimeout(t);if(!r.ok)return null;
    const d=await r.json();if(d.status!==1||!d.product)return null;
    const p=d.product;let name=(p.product_name_pt||p.product_name||'').trim();if(!name)return null;
    const qn=(p.quantity||'').trim();if(qn&&!norm(name).includes(norm(qn)))name+=` ${qn}`;
    return{name:name.slice(0,80),brand:(p.brands||'').split(',')[0].trim(),cat:mapOFF(p.categories_tags||[],name)};
  }catch(e){return null;}
}
function mapOFF(tags,name){
  const t=norm(tags.join(' ')+' '+name);
  if(/water|agua|eaux/.test(t)&&!/coco|tonica|saborizada/.test(t))return'agua';
  if(/pet-food|dog|cat-food|racao/.test(t))return'pet';
  if(/hygiene|toothpaste|soap|shampoo|toilet|papel hig|sabonete|creme dental/.test(t))return'higiene';
  if(/medic|pharma|farmac/.test(t))return'saude';
  return'alimento';
}

function lupaLive(){camUI('Enquadre a data de validade no retângulo<small>Boa luz ajuda. Aproxime até as letras ficarem nítidas.</small>',`<button onclick="closeCam()">Fechar</button><button class="p" onclick="freezeRead()">${ic('cam','width:18px;height:18px;vertical-align:-4px;margin-right:6px')}Ler data</button>`);}
async function lupaRetry(){
  const v=$('#cam video'),cv=$('#cam canvas');cv.hidden=true;v.hidden=false;lupaLive();
  try{await startVideo(true);}catch(e){closeCam();}
}
function freezeRead(){
  const v=$('#cam video'),cv=$('#cam canvas');
  if(!v.videoWidth){toast('Aguarde a câmera abrir');return;}
  cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext('2d').drawImage(v,0,0);
  const vr=v.getBoundingClientRect(),br=$('#cam .cam-box').getBoundingClientRect();
  const sc=Math.max(vr.width/v.videoWidth,vr.height/v.videoHeight);
  const ox=vr.left+(vr.width-v.videoWidth*sc)/2,oy=vr.top+(vr.height-v.videoHeight*sc)/2;
  let x=(br.left-ox)/sc,y=(br.top-oy)/sc,w=br.width/sc,h=br.height/sc;
  x-=w*.06;w*=1.12;y-=h*.7;h*=2.4;
  x=Math.max(0,x);y=Math.max(0,y);w=Math.min(cv.width-x,w);h=Math.min(cv.height-y,h);
  cam.crop={x,y,w,h};
  stopStream();v.hidden=true;cv.hidden=false;
  runOCR();
}
function ocrCanvas(){
  const src=$('#cam canvas'),c=cam.crop,scale=Math.min(3,Math.max(1,1400/c.w));
  const o=document.createElement('canvas');o.width=Math.round(c.w*scale);o.height=Math.round(c.h*scale);
  const x=o.getContext('2d');x.drawImage(src,c.x,c.y,c.w,c.h,0,0,o.width,o.height);
  const im=x.getImageData(0,0,o.width,o.height),d=im.data;let mn=255,mx=0;
  for(let i=0;i<d.length;i+=4){const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];d[i]=g;if(g<mn)mn=g;if(g>mx)mx=g;}
  const r=Math.max(1,mx-mn);for(let i=0;i<d.length;i+=4){const g=(d[i]-mn)*255/r;d[i]=d[i+1]=d[i+2]=g;}
  x.putImageData(im,0,0);return o;
}
async function runOCR(){
  camUI(`<span class="spin"></span>Lendo a data…${ocrWorker?'':'<small>Na primeira vez o leitor é baixado (alguns MB)</small>'}`,`<button onclick="closeCam()">Cancelar</button>`);
  try{
    await loadScript(TESS_URL);
    if(!ocrWorker){ocrWorker=await Tesseract.createWorker('eng');await ocrWorker.setParameters({tessedit_char_whitelist:'0123456789/.-: ABCDEFGHIJLMNOPRSTUVZ'});}
    if(cam.mode!=='lupa')return;
    const {data}=await ocrWorker.recognize(ocrCanvas());
    if(cam.mode!=='lupa')return;
    const d=pickDate(data.text||'');
    if(d){cam.found=d;camUI(`Data encontrada: <span style="color:var(--green)">${fDate(d)}</span><small>Confira na imagem antes de usar</small>`,`<button onclick="lupaRetry()">Tentar de novo</button><button class="p" onclick="useDate()">Usar ${fDate(d)}</button>`);}
    else camUI('Não consegui ler a data automaticamente<small>Leia na imagem congelada e digite no campo, ou tente de novo mais perto.</small>',`<button onclick="lupaRetry()">Tentar de novo</button><button class="p" onclick="closeCam()">Digitar</button>`);
  }catch(e){
    if(cam.mode==='lupa')camUI('Leitura automática indisponível agora<small>Sem internet? Leia na imagem congelada e digite no campo.</small>',`<button onclick="lupaRetry()">Tentar de novo</button><button class="p" onclick="closeCam()">Digitar</button>`);
  }
}
function useDate(){formData.expiry=cam.found;closeCam();sheetMode='form';drawSheet();openSheet();toast(`Validade ${fDate(cam.found)} preenchida`);}
const MES={JAN:1,FEV:2,FEB:2,MAR:3,ABR:4,APR:4,MAI:5,MAY:5,JUN:6,JUL:7,AGO:8,AUG:8,SET:9,SEP:9,OUT:10,OCT:10,NOV:11,DEZ:12,DEC:12};
function pickDate(raw){
  let t=' '+String(raw).toUpperCase().replace(/\s+/g,' ')+' ';
  t=t.replace(/(\d)[OQ]/g,'$10').replace(/[OQ](\d)/g,'0$1');
  const now=new Date().getFullYear(),out=[];
  const add=(y,m,d)=>{y=+y;if(y<100)y+=2000;m=+m;if(!(m>=1&&m<=12)||y<now-3||y>now+15)return;const last=new Date(y,m,0).getDate();d=d?+d:last;if(!(d>=1&&d<=last))return;out.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);};
  let m;
  const r1=/(\d{1,2}) ?[\/.\-] ?(\d{1,2}) ?[\/.\-] ?(\d{4}|\d{2})(?!\d)/g;while((m=r1.exec(t)))add(m[3],m[2],m[1]);
  const r2=/(?:^|[^\d\/.\-])(\d{1,2}) ?[\/.\-] ?(\d{4})(?!\d)/g;while((m=r2.exec(t)))add(m[2],m[1]);
  const r3=/(?:(\d{1,2}) ?[\/.\-]? ?)?(JAN|FEV|FEB|MAR|ABR|APR|MAI|MAY|JUN|JUL|AGO|AUG|SET|SEP|OUT|OCT|NOV|DEZ|DEC)[A-Z]*\.? ?[\/.\-]? ?(\d{4}|\d{2})(?!\d)/g;while((m=r3.exec(t)))add(m[3],MES[m[2]],m[1]);
  if(!out.length){const r4=/(?:^|[^\d\/.\-])(\d{1,2}) ?[\/.\-] ?(\d{2})(?![\d\/.\-])/g;while((m=r4.exec(t)))add(m[2],m[1]);}
  if(!out.length)return null;
  out.sort();return out[out.length-1];
}

   'Água é prioridade: guarde a água potável para beber e cozinhar. Use água de chuva ou de outras fontes para higiene e descarga.',
   'Purificação: 2 gotas de hipoclorito de sódio 2,5% por litro, misture e espere 30 minutos. Se a água estiver turva, coe num pano limpo antes. Ferver por 1 minuto também funciona.',
   'Racionamento: se o estoque não for durar, reduza primeiro as porções de comida, não a água. Adultos precisam de pelo menos 2 L de água por dia para beber.',
   'Rotação mensal (fora da emergência): troque o que vence em até 30 dias, teste lanternas, rádio e power bank, e gere este relatório de novo.'
  ].forEach((t,i)=>para(`${i+1}. ${t}`,{after:1,s:9.4}));
  h2('Contatos de emergência');
  const ct=[['Defesa Civil','199'],['Corpo de Bombeiros','193'],['SAMU','192'],['Polícia Militar','190'],['Familiar de referência',''],['Vizinho de confiança',''],['Médico / posto de saúde','']];
  if(c.dogs||c.cats)ct.push(['Veterinário','']);
  ct.push(['Ponto de encontro da família','']);
  table(['Serviço','Telefone / informação'],ct,{columnStyles:{0:{fontStyle:'bold',cellWidth:62}},bodyStyles:{minCellHeight:6.6},styles:{font:'helvetica',fontSize:8.8,cellPadding:1.5,textColor:INK,lineColor:[205,198,194],lineWidth:.15},pageBreak:'avoid'});

  /* 3. fichas para preencher à mão */
  doc.addPage();
  band('FICHA DE CONTROLE DE ESTOQUE','Anote toda entrada (+) e saída (-) de itens da reserva');
  table(['Data','Item','Entrada (+)','Saída (-)','Saldo','Validade','Quem'],Array.from({length:30},()=>['','','','','','','']),
    {bodyStyles:{minCellHeight:7.6},alternateRowStyles:{fillColor:[255,255,255]},columnStyles:{0:{cellWidth:18},1:{cellWidth:52},6:{cellWidth:22}}});
  doc.addPage();
  band('DIÁRIO DA EMERGÊNCIA',`Consumo esperado por dia: ${fN(R.agua.Ld)} L de água e ${fN(R.alimento.Kd,0)} kcal de comida`);
  table(['Dia','Data','Água usada (L)','Água restante (L)','Comida usada','Dias restantes','Observações'],Array.from({length:Math.min(Math.max(T,10),31)},(_,i)=>[String(i+1),'','','','','','']),
    {bodyStyles:{minCellHeight:7.3},alternateRowStyles:{fillColor:[255,255,255]},columnStyles:{0:{cellWidth:10,halign:'center',fontStyle:'bold'},1:{cellWidth:18}}});
  para(`Dias restantes = água restante ÷ ${fN(R.agua.Ld)} L. Faça a mesma conta com a comida e considere o menor resultado.`,{s:9});

  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(140,132,128);
    doc.text(pt(`Protocolo Vermelho Familiar · gerado em ${nowTxt}`),M,H-8);doc.text(`Página ${i} de ${n}`,W-M,H-8,{align:'right'});}
  const file=new File([doc.output('blob')],`protocolo-vermelho-${todayISO()}.pdf`,{type:'application/pdf'});
  return{file,pages:n};
}
function exportBackup(){
  const data={app:'protocolo-vermelho',v:3,exported:new Date().toISOString(),cfg:S.cfg,stock:S.stock};
  const f=new File([JSON.stringify(data)],`protocolo-vermelho-backup-${todayISO()}.json`,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))shareFile(f);else saveFile(f);
}
function importBackup(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.stock))throw 0;pendingImport=d;sheetMode='import';drawSheet();openSheet();}catch(e){toast('Esse arquivo não é um backup do Protocolo Vermelho');}};
  r.readAsText(f);
}
function applyImport(){
  try{localStorage.setItem('pv_prev',JSON.stringify({stock:S.stock,cfg:S.cfg,at:Date.now()}));}catch(e){}
  S.stock=pendingImport.stock;S.cfg={...DEF,...(pendingImport.cfg||{})};pendingImport=null;
  save();closeSheet();render();toast('Backup importado');
}

/* ================= MISC ================= */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(cam.mode)closeCam();else closeSheet();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cam.mode&&cam.mode!=='lupa')closeCam();});

load();
render();
</script>
