<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Protocolo Vermelho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/webp" href="icon.webp">
<link rel="apple-touch-icon" href="icon.webp">
<meta name="theme-color" content="#2A3A10">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root {
  --bg:#F0EDE4; --bg-card:#FAF8F3; --bg-muted:#E8E4D8; --bg-input:#FDFBF6;
  --fg:#1C1A10; --fg2:#5C5840; --fg3:#9C9870;
  --accent:#3A5010; --accent-mid:#5A7820; --accent-lite:#E8EDD8; --accent-dark:#2A3A0A;
  --border:#D4CEB8; --border2:#BEB894;
  --red:#C03010; --red-bg:#FCE8E0;
  --amber:#A05010; --amber-bg:#FCF0D8;
  --green:#2A6010; --green-bg:#E0F0D0;
  --shadow:0 2px 8px rgba(28,26,16,.10);
  --shadow-lg:0 8px 24px rgba(28,26,16,.16);
  --hdr-h:56px; --nav-h:60px;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#141710; --bg-card:#1E221A; --bg-muted:#181C14; --bg-input:#222818;
  --fg:#E8E6DA; --fg2:#A8A678; --fg3:#686440;
  --accent:#90B838; --accent-mid:#A8D040; --accent-lite:#1A2808; --accent-dark:#0C1404;
  --border:#303820; --border2:#484E28;
  --red:#E05030; --red-bg:#2A1510;
  --amber:#D09030; --amber-bg:#2A2010;
  --green:#60A830; --green-bg:#182808;
  --shadow:0 2px 8px rgba(0,0,0,.35);
  --shadow-lg:0 8px 24px rgba(0,0,0,.50);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#141710; --bg-card:#1E221A; --bg-muted:#181C14; --bg-input:#222818;
  --fg:#E8E6DA; --fg2:#A8A678; --fg3:#686440;
  --accent:#90B838; --accent-mid:#A8D040; --accent-lite:#1A2808; --accent-dark:#0C1404;
  --border:#303820; --border2:#484E28;
  --red:#E05030; --red-bg:#2A1510;
  --amber:#D09030; --amber-bg:#2A2010;
  --green:#60A830; --green-bg:#182808;
  --shadow:0 2px 8px rgba(0,0,0,.35);
  --shadow-lg:0 8px 24px rgba(0,0,0,.50);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{font-family:'Barlow',sans-serif;font-size:15px;line-height:1.5;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;min-height:100vh;padding-top:env(safe-area-inset-top,0px);overflow-x:hidden;}
button{background:none;border:none;cursor:pointer;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
img{max-width:100%}
header{position:sticky;top:0;z-index:30;background:var(--accent-dark);height:var(--hdr-h);display:flex;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 2px 8px rgba(0,0,0,.3);}
.hdr-logo{width:34px;height:34px;border-radius:50%;object-fit:cover;margin-right:10px;border:1.5px solid rgba(255,255,255,.25)}
.hdr-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;color:#fff;text-transform:uppercase;letter-spacing:.5px;line-height:1}
.hdr-sub{font-family:'Barlow Condensed',sans-serif;font-weight:400;font-size:12px;color:rgba(255,255,255,.65);letter-spacing:.5px;text-transform:uppercase;display:block;margin-top:1px}
main{flex:1;margin-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;}
.view{display:none;padding-bottom:24px}
.view.active{display:block}
.bot-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--bg-card);border-top:1px solid var(--border);display:flex;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg3);transition:color .15s;position:relative;padding:6px 2px;}
.nav-btn.active{color:var(--accent-mid)}
.nav-icon{font-size:20px;line-height:1}
.nav-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.nav-badge{position:absolute;top:5px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:10px;font-weight:700;line-height:1;padding:2px 5px;border-radius:10px;min-width:16px;text-align:center;}
.fab{position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);right:max(20px,env(safe-area-inset-right,0px));width:54px;height:54px;border-radius:50%;background:var(--accent-mid);color:#fff;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);z-index:20;transition:transform .15s,box-shadow .15s;}
.fab:active{transform:scale(.92)}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px;}
.sec-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--fg3);}
.sec-count{font-size:12px;color:var(--fg3)}
/* dashboard */
.setup-banner{margin:12px 16px 10px;border-radius:14px;padding:20px;background:linear-gradient(135deg,#2A3A0A 0%,#3A5010 100%);color:#fff;}
.setup-banner h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.setup-banner p{font-size:13px;opacity:.85;margin-bottom:14px;line-height:1.4}
.setup-banner-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#2A3A0A;font-weight:700;font-size:14px;padding:10px 20px;border-radius:9px;}
.dash-status{margin:12px 16px 10px;border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;}
.dash-status.good{background:var(--green-bg);border:1px solid var(--green)}
.dash-status.ok{background:var(--accent-lite);border:1px solid var(--border)}
.dash-status.warn{background:var(--amber-bg);border:1px solid var(--amber)}
.dash-status.crit{background:var(--red-bg);border:1px solid var(--red)}
.gauge-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:0 16px 10px}
.gauge-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.gauge-name{display:flex;align-items:center;gap:7px}
.gauge-icon{font-size:20px}
.gauge-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg2)}
.gauge-days{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;color:var(--fg);line-height:1}
.gauge-unit{font-size:12px;color:var(--fg3);margin-left:2px}
.gauge-track{height:9px;border-radius:5px;background:var(--border);overflow:hidden;margin-bottom:7px}
.gauge-fill{height:100%;border-radius:5px;transition:width .4s ease}
.gauge-fill.crit{background:var(--red)}
.gauge-fill.warn{background:var(--amber)}
.gauge-fill.ok{background:var(--accent-mid)}
.gauge-fill.great{background:#3A9020}
.gauge-meta{font-size:12px;color:var(--fg3);display:flex;justify-content:space-between}
/* estoque */
.search-wrap{padding:10px 16px 6px;display:flex;gap:8px;align-items:center}
.search-input{flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--fg);outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--accent-mid)}
.search-input::placeholder{color:var(--fg3)}
.sort-btn{flex-shrink:0;padding:8px 11px;border-radius:9px;background:var(--bg-input);border:1px solid var(--border);color:var(--fg2);font-size:13px;font-weight:500;white-space:nowrap;}
.sort-btn.active{background:var(--accent-lite);border-color:var(--accent-mid);color:var(--accent-dark)}
.cat-chips{display:flex;gap:7px;padding:4px 16px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.cat-chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 11px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--bg-card);color:var(--fg2);white-space:nowrap;transition:all .12s;}
.chip.active{background:var(--accent-lite);border-color:var(--accent-mid);color:var(--accent-dark);font-weight:600}
.item-row{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;margin:0 16px 7px;display:flex;align-items:center;gap:10px;padding:10px 12px;position:relative;overflow:hidden;}
.item-row.expired{border-color:var(--red);background:var(--red-bg)}
.item-row.soon{border-color:var(--amber)}
.item-icon{width:32px;height:32px;border-radius:8px;background:var(--accent-lite);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-qty{font-size:12px;color:var(--fg2);margin-top:1px}
.item-expiry{font-size:12px;white-space:nowrap;text-align:right;flex-shrink:0;padding-left:6px}
.item-expiry.ok{color:var(--fg3)}
.item-expiry.soon{color:var(--amber)}
.item-expiry.crit{color:var(--red);font-weight:600}
.item-menu-btn{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--fg3);font-size:18px;flex-shrink:0;}
.item-menu-btn:hover,.item-menu-btn:active{background:var(--bg-muted);color:var(--fg)}
.item-actions{display:none;position:absolute;right:0;top:0;bottom:0;align-items:center;background:var(--bg-card);border-left:1px solid var(--border);}
.item-actions.open{display:flex}
.item-act-btn{display:flex;align-items:center;justify-content:center;padding:0 14px;height:100%;font-size:13px;font-weight:600;gap:5px;}
.item-act-btn.edit{color:var(--accent-mid)}
.item-act-btn.del{color:var(--red)}
.item-act-btn:hover,.item-act-btn:active{background:var(--bg-muted)}
.empty-state{text-align:center;padding:48px 24px;color:var(--fg2)}
.empty-state-icon{font-size:48px;margin-bottom:12px}
.empty-state h3{font-size:17px;font-weight:600;margin-bottom:6px;color:var(--fg)}
.empty-state p{font-size:14px;margin-bottom:20px}
.btn-primary-outline{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:9px;border:2px solid var(--accent-mid);color:var(--accent-mid);font-weight:600;font-size:14px;}
/* alertas */
.alert-row{margin:0 16px 7px;border-radius:10px;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid;cursor:pointer;}
.alert-row.expired{background:var(--red-bg);border-color:var(--red)}
.alert-row.soon-crit{background:var(--amber-bg);border-color:var(--amber)}
.alert-row.soon{background:var(--bg-card);border-color:var(--border)}
.alert-icon{font-size:20px;flex-shrink:0}
.alert-info{flex:1;min-width:0}
.alert-name{font-weight:600;font-size:14px}
.alert-detail{font-size:12px;color:var(--fg2);margin-top:1px}
.alert-badge{padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.alert-badge.expired{background:var(--red);color:#fff}
.alert-badge.soon-crit{background:var(--amber);color:#fff}
.alert-badge.soon{background:var(--border);color:var(--fg2)}
/* config */
.cfg-section{margin:0 16px 16px}
.cfg-section-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--fg3);margin-bottom:10px;padding-top:16px;}
.cfg-row{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.cfg-label{flex:1;font-size:14px;font-weight:500}
.cfg-sub{font-size:12px;color:var(--fg3);display:block;margin-top:1px}
.cfg-num{width:62px;text-align:center;padding:5px 8px;background:var(--bg-input);border:1px solid var(--border);border-radius:7px;color:var(--fg);font-weight:600;outline:none;}
.cfg-num:focus{border-color:var(--accent-mid)}
.toggle{width:44px;height:26px;border-radius:13px;position:relative;background:var(--border);transition:background .2s;cursor:pointer;flex-shrink:0;}
.toggle.on{background:var(--accent-mid)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on::after{transform:translateX(18px)}
.cfg-save-btn{width:100%;padding:13px;border-radius:10px;background:var(--accent-mid);color:#fff;font-weight:700;font-size:15px;text-align:center;transition:opacity .15s;margin-top:8px;}
.cfg-save-btn:active{opacity:.8}
/* modal sheet */
.modal-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s;pointer-events:none;}
.modal-bg.open{opacity:1;pointer-events:all}
.modal-sheet{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--bg-card);border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.23,1);max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.modal-sheet.open{transform:translateY(0)}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:10px auto 0;flex-shrink:0}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.5px;padding:14px 18px 10px;}
.modal-body{padding:0 16px 16px}
.add-mode-btn{display:flex;align-items:center;gap:14px;background:var(--bg-muted);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;width:100%;text-align:left;transition:all .12s;}
.add-mode-btn:hover,.add-mode-btn:active{background:var(--accent-lite);border-color:var(--accent-mid)}
.add-mode-icon{font-size:26px;flex-shrink:0}
.add-mode-name{font-weight:600;font-size:15px;display:block}
.add-mode-desc{font-size:12px;color:var(--fg2)}
.cat-search{width:100%;padding:9px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:9px;color:var(--fg);outline:none;margin-bottom:10px;}
.cat-search:focus{border-color:var(--accent-mid)}
.cat-search::placeholder{color:var(--fg3)}
.catalog-group-hdr{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg3);padding:6px 2px 4px;}
.catalog-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:background .1s;border:1px solid transparent;}
.catalog-item:hover,.catalog-item:active{background:var(--accent-lite);border-color:var(--accent-mid)}
.catalog-item-icon{font-size:18px;flex-shrink:0}
.catalog-item-name{font-size:14px;font-weight:500;flex:1}
/* form */
.form-group{margin-bottom:12px}
.form-label{font-size:13px;font-weight:600;color:var(--fg2);display:block;margin-bottom:4px}
.form-input{width:100%;padding:9px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:9px;color:var(--fg);outline:none;transition:border-color .15s;}
.form-input:focus{border-color:var(--accent-mid)}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.form-row .form-group.f2{flex:2}
.form-actions{display:flex;gap:8px;padding-top:4px}
.btn-primary{flex:1;padding:12px;border-radius:9px;background:var(--accent-mid);color:#fff;font-weight:700;font-size:15px;text-align:center;transition:opacity .15s;}
.btn-primary:active{opacity:.8}
.btn-secondary{padding:12px 16px;border-radius:9px;background:var(--bg-muted);color:var(--fg2);font-weight:600;font-size:14px;text-align:center;border:1px solid var(--border);}
.btn-danger{flex:1;padding:12px;border-radius:9px;background:var(--red);color:#fff;font-weight:700;font-size:15px}
.barcode-scan-mini{width:40px;height:40px;border-radius:9px;background:var(--bg-muted);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;cursor:pointer;transition:all .12s;}
.barcode-scan-mini:hover{background:var(--accent-lite);border-color:var(--accent-mid)}
.hint-text{font-size:11px;color:var(--fg3);margin-top:3px}
.scan-fallback-row{display:flex;gap:8px;margin-bottom:12px}
/* barcode scanner */
.scanner-wrap{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#scan-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-dim{position:absolute;inset:0;background:rgba(0,0,0,.5);-webkit-mask:radial-gradient(ellipse 260px 100px at 50% 42%,transparent 100%,black 100%);mask:radial-gradient(ellipse 260px 100px at 50% 42%,transparent 100%,black 100%);}
.scan-box{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:260px;height:100px;border:2px solid var(--accent-mid);border-radius:8px;}
.scan-line{position:absolute;top:0;left:4px;right:4px;height:2px;background:var(--accent-mid);animation:scanLine 1.8s ease-in-out infinite;border-radius:1px;}
@keyframes scanLine{0%{top:4px;opacity:1}50%{top:calc(100% - 6px);opacity:1}60%{opacity:0}61%{top:4px}70%{opacity:1}100%{top:4px;opacity:1}}
.scan-corner{position:absolute;width:16px;height:16px}
.scan-corner.tl{top:-2px;left:-2px;border-top:3px solid #fff;border-left:3px solid #fff;border-radius:4px 0 0 0}
.scan-corner.tr{top:-2px;right:-2px;border-top:3px solid #fff;border-right:3px solid #fff;border-radius:0 4px 0 0}
.scan-corner.bl{bottom:-2px;left:-2px;border-bottom:3px solid #fff;border-left:3px solid #fff;border-radius:0 0 0 4px}
.scan-corner.br{bottom:-2px;right:-2px;border-bottom:3px solid #fff;border-right:3px solid #fff;border-radius:0 0 4px 0}
.scan-hint-text{position:absolute;bottom:28%;color:#fff;font-size:14px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.8);text-align:center;padding:0 20px;}
.scan-cancel-btn{position:absolute;bottom:max(24px,env(safe-area-inset-bottom,0px));padding:11px 28px;border-radius:30px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:600;font-size:15px;backdrop-filter:blur(6px);}
/* expiry camera */
#expiry-cam-wrap{position:fixed;inset:0;z-index:110;background:#000;display:flex;flex-direction:column;}
#expiry-video,#expiry-canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.expiry-cam-guide{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:84%;max-width:360px;height:60px;border:2px solid rgba(255,255,255,.9);border-radius:6px;box-shadow:0 0 0 2000px rgba(0,0,0,.55);}
.expiry-cam-label{position:absolute;top:calc(38% + 38px);left:0;right:0;text-align:center;color:#fff;font-size:14px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.9);}
.expiry-cam-tip{position:absolute;top:max(16px,env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.85);font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.9);padding:0 20px;}
.expiry-cam-btns{position:absolute;bottom:max(24px,env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:12px;}
.expiry-cam-btn{padding:12px 24px;border-radius:30px;font-weight:600;font-size:14px;backdrop-filter:blur(6px);}
.expiry-cam-btn.cancel{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff}
.expiry-cam-btn.capture{background:var(--accent-mid);color:#fff;border:none}
.expiry-cam-btn.close-cap{background:#fff;color:#1C1A10;border:none}
/* confirm */
.confirm-body{padding:16px 18px 20px}
.confirm-text{font-size:15px;color:var(--fg);margin:12px 0 20px;text-align:center}
.confirm-actions{display:flex;gap:8px}
/* loading / toast */
.loading-spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent-mid);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%) translateY(0);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:200;white-space:nowrap;transition:opacity .3s,transform .3s;opacity:0;pointer-events:none;}
.toast.show{opacity:1}
.toast.hide{opacity:0;transform:translateX(-50%) translateY(8px)}
.loading-box{text-align:center;padding:36px 16px;color:var(--fg2)}
.modal-back{display:flex;align-items:center;gap:6px;color:var(--accent-mid);font-weight:600;font-size:14px;padding:12px 18px 0;cursor:pointer;}
.modal-back:active{opacity:.7}
</style>

<body>

<header>

  <div>
    <span class="hdr-title">Protocolo</span>
    <span class="hdr-sub">Vermelho</span>
  </div>
</header>

<main>
  <div id="v-dash" class="view active"></div>
  <div id="v-stock" class="view"></div>
  <div id="v-alerts" class="view"></div>
  <div id="v-config" class="view"></div>
</main>

<nav class="bot-nav">
  <button class="nav-btn active" data-tab="dash" onclick="go('dash')">

  </button>
  <button class="nav-btn" data-tab="stock" onclick="go('stock')">

  <button class="nav-btn" data-tab="alerts" onclick="go('alerts')">

  <div id="modal-add-body"></div>
</div>

<!-- Barcode scanner -->
<div class="scanner-wrap" id="scanner-wrap" hidden>
  <video id="scan-video" autoplay playsinline muted></video>
  <div class="scan-dim"></div>
  <div class="scan-box">
    <div class="scan-corner tl"></div><div class="scan-corner tr"></div>
    <div class="scan-corner bl"></div><div class="scan-corner br"></div>
    <div class="scan-line"></div>
  </div>

  <button class="scan-cancel-btn" onclick="stopScan()">✕ Cancelar</button>
</div>

<!-- Expiry camera (lupa) -->
<div id="expiry-cam-wrap" hidden>

  <canvas id="expiry-canvas" hidden></canvas>
  <div class="expiry-cam-guide" id="expiry-guide"></div>
  <p class="expiry-cam-label" id="expiry-cam-label">Enquadre a data de validade</p>
  <p class="expiry-cam-tip">Leia a data e preencha no campo de validade</p>
  <div class="expiry-cam-btns" id="expiry-cam-btns">
    <button class="expiry-cam-btn cancel" onclick="closeExpiryCamera()">✕ Fechar</button>

  </div>

<div class="modal-bg" id="confirm-bg" onclick="closeConfirm()" style="z-index:60"></div>

      <button class="btn-danger" id="confirm-ok-btn">Excluir</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS={agua:{label:'Água',icon:'💧'},graos:{label:'Grãos',icon:'🌾'},proteina:{label:'Proteínas',icon:'🥩'},conserva:{label:'Conservas',icon:'🥫'},bebidas:{label:'Bebidas',icon:'🧃'},saude:{label:'Saúde',icon:'🩹'},higiene:{label:'Higiene',icon:'🧼'},energia:{label:'Energia',icon:'🔦'},pet:{label:'Pet',icon:'🐾'},outros:{label:'Outros',icon:'📦'}};
const FOOD_CATS=['graos','proteina','conserva','bebidas'];
const CAT_UNITS={agua:['un','L','galão'],graos:['kg','pct','g'],proteina:['un','kg','pct','g'],conserva:['un','caixa','kg'],bebidas:['un','cx','L','kg'],saude:['un','cx','fr','sc'],higiene:['un','pct','cx','rl'],energia:['un','cx'],pet:['un','sc','kg'],outros:['un','cx','pct']};
const CATALOG=[

  {id:'c053',name:'Paracetamol infantil gotas',cat:'saude',unit:'fr',portionDays:0},
  {id:'c054',name:'Soro fisiológico 0,9%',cat:'saude',unit:'cx',portionDays:0},

  {id:'c064',name:'Sacos de lixo 100L',cat:'higiene',unit:'rl',portionDays:0},
  {id:'c065',name:'Sabão em pó',cat:'higiene',unit:'cx',portionDays:0},
  {id:'c070',name:'Lanterna LED',cat:'energia',unit:'un',portionDays:0},
  {id:'c071',name:'Lanterna de cabeça',cat:'energia',unit:'un',portionDays:0},
  {id:'c072',name:'Pilhas AA cx 20un',cat:'energia',unit:'cx',portionDays:0},
  {id:'c073',name:'Power bank 10.000 mAh',cat:'energia',unit:'un',portionDays:0},
  {id:'c074',name:'Rádio AM/FM a pilhas',cat:'energia',unit:'un',portionDays:0},
  {id:'c075',name:'Vela parafina + fósforos',cat:'energia',unit:'cx',portionDays:0},
  {id:'c080',name:'Ração cão grande',cat:'pet',unit:'sc',portionDays:25},
  {id:'c081',name:'Ração cão médio',cat:'pet',unit:'sc',portionDays:10},
  {id:'c082',name:'Ração cão pequeno',cat:'pet',unit:'sc',portionDays:12},
  {id:'c083',name:'Ração gato',cat:'pet',unit:'sc',portionDays:12},
  {id:'c084',name:'Pote inox animal',cat:'pet',unit:'un',portionDays:0},
  {id:'c090',name:'Cobertor térmico mylar',cat:'outros',unit:'un',portionDays:0},
  {id:'c091',name:'Extintor pó ABC',cat:'outros',unit:'un',portionDays:0},
  {id:'c092',name:'Pasta impermeável documentos',cat:'outros',unit:'un',portionDays:0},
];
const DEFAULT_CFG={adults:1,children:0,elderly:0,hasPet:false,targetDays:15,alertDays:30,_ok:false};

let S={stock:[],config:{...DEFAULT_CFG}};
let currentTab='dash',addMode='select',formData={},editingId=null;
let stockSearch='',catFilterVal='',stockSort='expiry',openMenuId=null;
let scanStream=null,scanTimer=null,scanStopped=false,expiryCamStream=null;

function load(){try{const st=localStorage.getItem('dp_stock'),cf=localStorage.getItem('dp_cfg');if(st)S.stock=JSON.parse(st);if(cf)S.config={...DEFAULT_CFG,...JSON.parse(cf)};}catch(e){}}
function save(){try{localStorage.setItem('dp_stock',JSON.stringify(S.stock));localStorage.setItem('dp_cfg',JSON.stringify(S.config));}catch(e){}}

function go(tab){
  currentTab=tab;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  const map={dash:'v-dash',stock:'v-stock',alerts:'v-alerts',config:'v-config'};
  document.getElementById(map[tab])?.classList.add('active');
  render();
}
function render(){rDash();rStock();rAlerts();rConfig();updateBadge();}

function today(){return new Date().toISOString().slice(0,10);}
function dLeft(exp){if(!exp)return Infinity;return Math.floor((new Date(exp+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);}
function isExp(exp){return exp&&dLeft(exp)<0;}
function isSoon(exp){const d=dLeft(exp);return isFinite(d)&&d>=0&&d<=(S.config.alertDays||30);}
function fDate(str){if(!str)return'Sem validade';const[y,m,d]=str.split('-');return`${d}/${m}/${y}`;}
function fDaysLeft(exp){if(!exp)return'';const d=dLeft(exp);if(d<0)return`venceu há ${-d}d`;if(d===0)return'vence hoje';if(d===1)return'amanhã';if(d<=30)return`${d} dias`;return fDate(exp);}
function uid(){return'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show';setTimeout(()=>t.className='toast hide',2300);}
function portRate(cat,unit){const r={agua:{L:1/3,mL:1/3000,un:0.5,galão:20/3,cx:0.5},graos:{kg:5,g:0.005,pct:2.5,un:1},proteina:{un:1.5,kg:10,g:0.01,pct:2},conserva:{un:0.5,kg:4,caixa:2,pct:1},bebidas:{un:0.5,cx:2,L:1,kg:3},pet:{un:0,sc:5,kg:4}};return(r[cat]||{})[unit]||0;}

function eff(){const c=S.config;return Math.max(0.5,(c.adults||1)+(c.children||0)*0.6+(c.elderly||0)*0.8);}
function wDays(){return S.stock.filter(i=>i.cat==='agua'&&!isExp(i.expiry)).reduce((s,i)=>s+(i.portionDays||0)*(i.qty||0),0)/eff();}
function fDays(){return S.stock.filter(i=>FOOD_CATS.includes(i.cat)&&!isExp(i.expiry)).reduce((s,i)=>s+(i.portionDays||0)*(i.qty||0),0)/eff();}
function petDays(){return S.stock.filter(i=>i.cat==='pet'&&!isExp(i.expiry)).reduce((s,i)=>s+(i.portionDays||0)*(i.qty||0),0);}
function alertCount(){return S.stock.filter(i=>isExp(i.expiry)||isSoon(i.expiry)).length;}
function updateBadge(){const n=alertCount(),b=document.getElementById('alert-badge');if(n>0){b.textContent=n>9?'9+':n;b.hidden=false;}else b.hidden=true;}

/* ---- DASHBOARD ---- */
function rDash(){
  const el=document.getElementById('v-dash');if(!el)return;
  const c=S.config,target=c.targetDays||15,w=wDays(),f=fDays(),pr=Math.min(w,f);
  let topCard;
  if(!c._ok){
    topCard=`<div class="setup-banner"><h2>⚙️ Configure sua família</h2><p>Informe quantas pessoas moram na casa para calcular corretamente os dias de reserva de Água e Alimentos.</p><button class="setup-banner-btn" onclick="go('config')">Configurar família →</button></div>`;
  }else{
    const cls=pr>=target?'good':pr>=7?'ok':pr>=3?'warn':'crit';
    const icon=pr>=target?'✅':pr>=7?'⚡':pr>=3?'⚠️':'🆘';
    const lim=w<=f?'💧 Água':'🍽️ Alimentos';
    topCard=`<div class="dash-status ${cls}"><div style="font-size:32px;flex-shrink:0">${icon}</div><div><div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--fg2)">Prontidão estimada</div><div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:38px;line-height:1;color:var(--fg)">${pr<1&&pr>0?'<&nbsp;1':Math.floor(pr)} dias</div><div style="font-size:12px;color:var(--fg2);margin-top:2px">Limitado por ${lim}</div></div></div>`;
  }
  const gauge=(title,icon,days,meta)=>{
    const pct=Math.min(days/target*100,100);
    const cls=days<3?'crit':days<7?'warn':days<target?'ok':'great';
    const lbl=days<3?'⚠️ Crítico':days<7?'⚠️ Baixo':days<target?'✓ Estável':'✓ Meta atingida';
    return`<div class="gauge-card"><div class="gauge-top"><div class="gauge-name"><span class="gauge-icon">${icon}</span><span class="gauge-title">${title}</span></div><div><span class="gauge-days">${days<1&&days>0?'<1':Math.floor(days)}</span><span class="gauge-unit"> dias</span></div></div><div class="gauge-track"><div class="gauge-fill ${cls}" style="width:${pct}%"></div></div><div class="gauge-meta"><span>${lbl}</span><span>${meta}</span></div></div>`;
  };
  const nW=S.stock.filter(i=>i.cat==='agua'&&!isExp(i.expiry)).length;
  const nF=S.stock.filter(i=>FOOD_CATS.includes(i.cat)&&!isExp(i.expiry)).length;
  const ac=alertCount();
  const alertCard=ac>0?`<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin:0 16px 10px;display:flex;align-items:center;gap:12px;cursor:pointer" onclick="go('alerts')"><span style="font-size:24px">🔔</span><div style="flex:1"><div style="font-weight:600;font-size:14px">${ac} item${ac!==1?'s':''} ${ac===1?'precisa':'precisam'} de atenção</div><div style="font-size:12px;color:var(--fg2)">Vencidos ou próximos do vencimento</div></div><span style="color:var(--fg3);font-size:18px">›</span></div>`:'';
  const petCard=c.hasPet&&S.stock.some(i=>i.cat==='pet')?gauge('Pet','🐾',petDays(),`${S.stock.filter(i=>i.cat==='pet'&&!isExp(i.expiry)).length} item(s)`):'';
  const peopleInfo=c._ok?`<div style="text-align:center;padding:2px 16px 10px"><span style="font-size:12px;color:var(--fg3)">${c.adults||1} adulto${(c.adults||1)!==1?'s':''}${c.children?` · ${c.children} criança${c.children!==1?'s':''}` :''}${c.elderly?` · ${c.elderly} idoso${c.elderly!==1?'s':''}` :''} · Meta: ${target} dias — <span style="color:var(--accent-mid);cursor:pointer" onclick="go('config')">editar</span></span></div>`:'';
  el.innerHTML=topCard+peopleInfo+gauge('Água','💧',w,`${nW} item(s)`)+gauge('Alimentos','🍽️',f,`${nF} item(s)`)+petCard+alertCard+`<div style="text-align:center;padding:16px 16px 0"><button class="btn-primary-outline" onclick="go('stock')">📦 Ver estoque</button></div>`;
}

/* ---- ESTOQUE ---- */
function rStock(){
  const el=document.getElementById('v-stock');if(!el)return;
  const chips=['', ...Object.keys(CATS)].map(k=>{
    const active=catFilterVal===k;
    const label=k===''?'Todos':`${CATS[k].icon} ${CATS[k].label}`;
    return`<button class="chip ${active?'active':''}" onclick="setCatFilter('${k}')">${label}</button>`;
  }).join('');
  const sortLbl=stockSort==='expiry'?'📅 Validade':'🔤 Nome';
  let items=S.stock.filter(i=>{
    const ms=!stockSearch||i.name.toLowerCase().includes(stockSearch.toLowerCase());
    const mc=!catFilterVal||i.cat===catFilterVal;
    return ms&&mc;
  });
  if(stockSort==='expiry'){
    items.sort((a,b)=>{
      const ae=isExp(a.expiry),be=isExp(b.expiry);
      if(ae&&!be)return-1;if(!ae&&be)return 1;
      if(a.expiry&&b.expiry)return a.expiry.localeCompare(b.expiry);
      if(a.expiry&&!b.expiry)return-1;if(!a.expiry&&b.expiry)return 1;
      return a.name.localeCompare(b.name);
    });
  }else{
    items.sort((a,b)=>a.name.localeCompare(b.name));
  }
  const hdr=`<div class="search-wrap"><input class="search-input" placeholder="🔍 Buscar..." oninput="onStockSearch(this.value)" value="${esc(stockSearch)}"><button class="sort-btn ${stockSort==='expiry'?'active':''}" onclick="toggleSort()">${sortLbl}</button></div><div class="cat-chips">${chips}</div>`;
  if(S.stock.length===0){
    el.innerHTML=hdr+`<div class="empty-state"><div class="empty-state-icon">📦</div><h3>Estoque vazio</h3><p>Comece registrando o que você tem em casa</p><button class="btn-primary-outline" onclick="openAdd()">+ Adicionar item</button></div>`;
    el.insertAdjacentHTML('beforeend','<button class="fab" onclick="openAdd()">+</button>');
    return;
  }
  const grouped={};
  items.forEach(i=>{if(!grouped[i.cat])grouped[i.cat]=[];grouped[i.cat].push(i);});
  let html=hdr;
  if(!items.length){html+=`<div style="text-align:center;padding:32px;color:var(--fg2)">Nenhum item encontrado</div>`;}
  else{
    Object.keys(grouped).forEach(cat=>{
      const c=CATS[cat]||{icon:'📦',label:cat};
      const rows=grouped[cat];
      html+=`<div class="sec-hdr"><span class="sec-title">${c.icon} ${c.label}</span><span class="sec-count">${rows.length} item${rows.length!==1?'s':''}</span></div>`;
      rows.forEach(item=>{
        const exp=isExp(item.expiry),soon=isSoon(item.expiry);
        const cls=exp?'expired':soon?'soon':'';
        const expCls=exp?'crit':soon&&dLeft(item.expiry)<=7?'crit':soon?'soon':'ok';
        const expTxt=item.expiry?fDaysLeft(item.expiry):'Sem validade';
        const actOpen=openMenuId===item.id;
        html+=`<div class="item-row ${cls}" id="row-${item.id}"><div class="item-icon">${c.icon}</div><div class="item-info"><div class="item-name">${esc(item.name)}</div><div class="item-qty">${item.qty} ${item.unit}</div></div><div class="item-expiry ${expCls}">${expTxt}</div><button class="item-menu-btn" onclick="toggleMenu('${item.id}',event)">⋮</button><div class="item-actions ${actOpen?'open':''}"><button class="item-act-btn edit" onclick="editItem('${item.id}')">✏️ Editar</button><button class="item-act-btn del" onclick="confirmDel('${item.id}')">🗑️</button></div></div>`;
      });
    });
  }
  el.innerHTML=html;
  el.insertAdjacentHTML('beforeend','<button class="fab" onclick="openAdd()">+</button>');
}
function onStockSearch(v){stockSearch=v;rStock();}
function setCatFilter(v){catFilterVal=v;rStock();}
function toggleSort(){stockSort=stockSort==='expiry'?'name':'expiry';rStock();}
function toggleMenu(id,e){e.stopPropagation();openMenuId=openMenuId===id?null:id;rStock();}
document.addEventListener('click',()=>{if(openMenuId){openMenuId=null;rStock();}});

/* ---- ALERTAS ---- */
function rAlerts(){
  const el=document.getElementById('v-alerts');if(!el)return;
  const exp=S.stock.filter(i=>isExp(i.expiry)).sort((a,b)=>a.expiry.localeCompare(b.expiry));
  const sc=S.stock.filter(i=>!isExp(i.expiry)&&isSoon(i.expiry)&&dLeft(i.expiry)<=7).sort((a,b)=>a.expiry.localeCompare(b.expiry));
  const sn=S.stock.filter(i=>!isExp(i.expiry)&&isSoon(i.expiry)&&dLeft(i.expiry)>7).sort((a,b)=>a.expiry.localeCompare(b.expiry));
  if(!exp.length&&!sc.length&&!sn.length){el.innerHTML=`<div class="empty-state"><div class="empty-state-icon">✅</div><h3>Tudo em ordem</h3><p>Nenhum item vencido ou próximo do vencimento</p></div>`;return;}
  const row=(item,type)=>{
    const c=CATS[item.cat]||{icon:'📦'};
    const d=dLeft(item.expiry);
    const badge=type==='exp'?`<span class="alert-badge expired">Vencido</span>`:type==='sc'?`<span class="alert-badge soon-crit">${d}d</span>`:`<span class="alert-badge soon">${fDaysLeft(item.expiry)}</span>`;
    return`<div class="alert-row ${type==='exp'?'expired':type==='sc'?'soon-crit':'soon'}" onclick="editItem('${item.id}')"><span class="alert-icon">${c.icon}</span><div class="alert-info"><div class="alert-name">${esc(item.name)}</div><div class="alert-detail">${item.qty} ${item.unit} · ${fDate(item.expiry)}</div></div>${badge}</div>`;
  };
  let html='';
  if(exp.length)html+=`<div class="sec-hdr"><span class="sec-title" style="color:var(--red)">🆘 Vencidos</span><span class="sec-count">${exp.length}</span></div>`+exp.map(i=>row(i,'exp')).join('');
  if(sc.length)html+=`<div class="sec-hdr"><span class="sec-title" style="color:var(--amber)">⚠️ Vence em até 7 dias</span><span class="sec-count">${sc.length}</span></div>`+sc.map(i=>row(i,'sc')).join('');
  if(sn.length)html+=`<div class="sec-hdr"><span class="sec-title">🕐 Próximos</span><span class="sec-count">${sn.length}</span></div>`+sn.map(i=>row(i,'sn')).join('');
  el.innerHTML=html;
}

/* ---- CONFIG ---- */
function rConfig(){
  const el=document.getElementById('v-config');if(!el)return;
  const c=S.config;
  el.innerHTML=`<div class="cfg-section"><div class="cfg-section-title">Pessoas na casa</div>
    <div class="cfg-row"><div class="cfg-label">Adultos (≥13 anos)<span class="cfg-sub">Consumo padrão</span></div><input class="cfg-num" type="number" min="0" max="20" value="${c.adults||1}" oninput="S.config.adults=+this.value"></div>
    <div class="cfg-row"><div class="cfg-label">Crianças (&lt;13 anos)<span class="cfg-sub">60% do consumo adulto</span></div><input class="cfg-num" type="number" min="0" max="20" value="${c.children||0}" oninput="S.config.children=+this.value"></div>
    <div class="cfg-row"><div class="cfg-label">Idosos (&gt;65 anos)<span class="cfg-sub">80% do consumo adulto</span></div><input class="cfg-num" type="number" min="0" max="20" value="${c.elderly||0}" oninput="S.config.elderly=+this.value"></div>
    <div class="cfg-row"><div class="cfg-label">Tem animais de estimação?<span class="cfg-sub">Exibe painel de ração no painel</span></div><div class="toggle ${c.hasPet?'on':''}" onclick="togglePet()" id="pet-toggle"></div></div>
    </div><div class="cfg-section"><div class="cfg-section-title">Metas e alertas</div>
    <div class="cfg-row"><div class="cfg-label">Meta de dias de reserva<span class="cfg-sub">Padrão: 15 dias</span></div><input class="cfg-num" type="number" min="3" max="365" value="${c.targetDays||15}" oninput="S.config.targetDays=+this.value"></div>
    <div class="cfg-row"><div class="cfg-label">Alertar X dias antes do vencimento<span class="cfg-sub">Padrão: 30 dias</span></div><input class="cfg-num" type="number" min="3" max="180" value="${c.alertDays||30}" oninput="S.config.alertDays=+this.value"></div>
    </div><div class="cfg-section"><button class="cfg-save-btn" onclick="saveCfg()">✓ Salvar e ver painel</button></div>
    <div style="text-align:center;padding:8px 16px 24px"><span style="font-size:12px;color:var(--fg3)">Protocolo Vermelho · v2.1</span></div>`;
}
function togglePet(){S.config.hasPet=!S.config.hasPet;const t=document.getElementById('pet-toggle');if(t)t.className='toggle '+(S.config.hasPet?'on':'');}
function saveCfg(){S.config._ok=true;save();showToast('Configuração salva');go('dash');}

/* ---- ADD FLOW ---- */
function openAdd(predata){
  if(predata){formData={...predata};addMode='form';}else{formData={};addMode='select';}
  editingId=null;rModal();
  document.getElementById('modal-bg').classList.add('open');
  document.getElementById('modal-add').classList.add('open');
}
function closeAdd(){
  document.getElementById('modal-bg').classList.remove('open');
  document.getElementById('modal-add').classList.remove('open');
  setTimeout(()=>{addMode='select';formData={};editingId=null;},300);
}
function setMode(m){addMode=m;rModal();}

function rModal(){
  const body=document.getElementById('modal-add-body');if(!body)return;
  if(addMode==='select'){
    body.innerHTML=`<div class="modal-title">Adicionar item</div><div class="modal-body">
      <button class="add-mode-btn" onclick="tryStartScan()"><span class="add-mode-icon">📷</span><div><span class="add-mode-name">Escanear código de barras</span><span class="add-mode-desc">Busca o produto automaticamente</span></div></button>
      <button class="add-mode-btn" onclick="setMode('catalog')"><span class="add-mode-icon">📋</span><div><span class="add-mode-name">Buscar no catálogo</span><span class="add-mode-desc">Itens sugeridos para emergência</span></div></button>
      <button class="add-mode-btn" onclick="openForm({})"><span class="add-mode-icon">✏️</span><div><span class="add-mode-name">Adicionar manualmente</span><span class="add-mode-desc">Preencha nome e dados do item</span></div></button>
    </div>`;
  }else if(addMode==='catalog'){
    body.innerHTML=`<div style="display:flex;align-items:center"><div class="modal-back" onclick="setMode('select')">‹ Voltar</div><div class="modal-title" style="padding-left:4px">Catálogo</div></div><div class="modal-body"><input class="cat-search" placeholder="🔍 Buscar..." oninput="rCatalog(this.value)"><div id="catalog-list">${buildCatalogList('')}</div></div>`;
  }else if(addMode==='form'){
    body.innerHTML=`<div style="display:flex;align-items:center"><div class="modal-back" onclick="setMode('select')">‹ Voltar</div><div class="modal-title" style="padding-left:4px">${editingId?'Editar item':'Novo item'}</div></div><div class="modal-body">${buildForm()}</div>`;
    document.getElementById('item-form').addEventListener('submit',e=>{e.preventDefault();submitForm();});
  }else if(addMode==='scan-fallback'){
    body.innerHTML=`<div style="display:flex;align-items:center"><div class="modal-back" onclick="setMode('select')">‹ Voltar</div><div class="modal-title" style="padding-left:4px">Código de barras</div></div><div class="modal-body"><p style="font-size:14px;color:var(--fg2);margin-bottom:12px">Scanner não disponível neste navegador. Digite o EAN abaixo.</p><div class="scan-fallback-row"><input class="form-input" type="text" id="manual-ean" placeholder="EAN-13 (ex: 7891000...)" style="flex:1"><button class="btn-primary" style="flex:0;white-space:nowrap;padding:9px 14px" onclick="lookupManualEAN()">Buscar</button></div><div id="off-status" style="font-size:13px;color:var(--fg2);margin-bottom:12px"></div><div style="border-top:1px solid var(--border);padding-top:12px"><button class="btn-secondary" style="width:100%" onclick="openForm({barcode:document.getElementById('manual-ean')?.value||''})">✏️ Adicionar manualmente</button></div></div>`;
  }else if(addMode==='loading'){
    body.innerHTML=`<div class="loading-box"><span class="loading-spin"></span>Buscando produto...</div>`;
  }
}

function buildCatalogList(q){
  const f=q.toLowerCase().trim();
  const g={};
  CATALOG.forEach(i=>{if(f&&!i.name.toLowerCase().includes(f))return;if(!g[i.cat])g[i.cat]=[];g[i.cat].push(i);});
  if(!Object.keys(g).length)return`<div style="text-align:center;padding:24px;color:var(--fg3)">Nenhum item encontrado</div>`;
  return Object.entries(g).map(([cat,items])=>{
    const c=CATS[cat]||{icon:'📦',label:cat};
    return`<div><div class="catalog-group-hdr">${c.icon} ${c.label}</div>`+items.map(i=>`<div class="catalog-item" onclick="pickCatalog('${i.id}')"><span class="catalog-item-icon">${c.icon}</span><span class="catalog-item-name">${esc(i.name)}</span><span style="font-size:12px;color:var(--accent-mid);font-weight:600">+ Adicionar</span></div>`).join('')+`</div>`;
  }).join('');
}
function rCatalog(q){const el=document.getElementById('catalog-list');if(el)el.innerHTML=buildCatalogList(q);}

function pickCatalog(id){
  const item=CATALOG.find(c=>c.id===id);if(!item)return;
  formData={name:item.name,cat:item.cat,qty:'',unit:item.unit,portionDays:item.portionDays,_fromCatalog:true};
  addMode='form';rModal();
}

function buildForm(){
  const fd=formData;
  const catOpts=Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${fd.cat===k?'selected':''}>${v.icon} ${v.label}</option>`).join('');
  const curCat=fd.cat||'outros';
  const unitOpts=(CAT_UNITS[curCat]||['un']).map(u=>`<option value="${u}" ${fd.unit===u?'selected':''}>${u}</option>`).join('');
  const qtyVal=fd.qty!==undefined&&fd.qty!==''?fd.qty:'';
  return`<form id="item-form" novalidate>
    <div class="form-group"><label class="form-label">Nome do produto *</label><input name="name" type="text" class="form-input" required value="${esc(fd.name||'')}" placeholder="ex: Arroz branco 1kg" maxlength="80" autocomplete="off"></div>
    <div class="form-row"><div class="form-group f2"><label class="form-label">Categoria</label><select name="cat" class="form-input" id="form-cat" onchange="onCatChange(this.value)">${catOpts}</select></div><div class="form-group"><label class="form-label">Qtd *</label><input name="qty" type="number" class="form-input" min="0.01" step="0.01" value="${qtyVal}" placeholder="ex: 3"></div><div class="form-group"><label class="form-label">Unid.</label><select name="unit" class="form-input" id="form-unit">${unitOpts}</select></div></div>
    <div class="form-group"><label class="form-label">Data de validade</label><div style="display:flex;gap:7px;align-items:center"><input name="expiry" type="date" class="form-input" value="${fd.expiry||''}" style="flex:1"><button type="button" class="barcode-scan-mini" title="Câmera lupa — ver data na embalagem" onclick="openExpiryCamera()">📷</button></div><span class="hint-text">Toque 📷 para usar a câmera como lupa. Deixe em branco se não tiver validade.</span></div>
    <div class="form-group"><label class="form-label">Código de barras</label><div style="display:flex;gap:7px;align-items:flex-end"><input name="barcode" type="text" class="form-input" value="${esc(fd.barcode||'')}" placeholder="EAN-13 (opcional)" style="flex:1"><button type="button" class="barcode-scan-mini" title="Escanear código" onclick="startMiniScan()">📷</button></div></div>
    <div class="form-group"><label class="form-label">Observações</label><input name="notes" type="text" class="form-input" value="${esc(fd.notes||'')}" placeholder="opcional"></div>
    <div class="form-actions"><button type="button" class="btn-secondary" onclick="closeAdd()">Cancelar</button><button type="submit" class="btn-primary">${editingId?'Salvar':'Adicionar'}</button></div>
  </form>`;
}
function onCatChange(cat){const sel=document.getElementById('form-unit');if(!sel)return;sel.innerHTML=(CAT_UNITS[cat]||['un']).map(u=>`<option value="${u}">${u}</option>`).join('');}
function submitForm(){
  const f=document.getElementById('item-form');if(!f)return;
  const name=f.querySelector('[name=name]').value.trim();
  if(!name){showToast('Preencha o nome do produto');return;}
  const qtyVal=f.querySelector('[name=qty]').value;
  if(!qtyVal||isNaN(parseFloat(qtyVal))){showToast('Preencha a quantidade');return;}
  const cat=f.querySelector('[name=cat]').value;
  const qty=parseFloat(qtyVal);
  const unit=f.querySelector('[name=unit]').value;
  const expiry=f.querySelector('[name=expiry]').value;
  const barcode=f.querySelector('[name=barcode]').value.trim();
  const notes=f.querySelector('[name=notes]').value.trim();
  const pd=formData._fromCatalog&&formData.portionDays!==undefined?formData.portionDays:portRate(cat,unit);
  const item={id:editingId||uid(),name,cat,qty,unit,expiry,barcode,notes,portionDays:pd,addedDate:today()};
  if(editingId){S.stock=S.stock.map(i=>i.id===editingId?{...i,...item}:i);showToast('Item atualizado');}
  else{S.stock.push(item);showToast('Item adicionado');}
  save();closeAdd();setTimeout(()=>render(),350);
  editingId=null;formData={};
}
function editItem(id){
  const item=S.stock.find(i=>i.id===id);if(!item)return;
  editingId=id;formData={...item};addMode='form';
  rModal();
  document.getElementById('modal-bg').classList.add('open');
  document.getElementById('modal-add').classList.add('open');
  openMenuId=null;
}
function confirmDel(id){
  openMenuId=null;
  const item=S.stock.find(i=>i.id===id);if(!item)return;
  document.getElementById('confirm-text').textContent=`Excluir "${item.name}"?`;
  document.getElementById('confirm-ok-btn').onclick=()=>deleteItem(id);
  document.getElementById('confirm-bg').classList.add('open');
  document.getElementById('modal-confirm').classList.add('open');
}
function deleteItem(id){S.stock=S.stock.filter(i=>i.id!==id);save();closeConfirm();render();showToast('Item excluído');}
function closeConfirm(){document.getElementById('confirm-bg').classList.remove('open');document.getElementById('modal-confirm').classList.remove('open');}

/* ---- BARCODE SCANNER ---- */
async function tryStartScan(){
  if(!('BarcodeDetector' in window)){setMode('scan-fallback');return;}
  try{
    scanStopped=false;
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});
    const video=document.getElementById('scan-video');
    video.srcObject=scanStream;await video.play();
    const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
    document.getElementById('scanner-wrap').hidden=false;
    scanTimer=setInterval(async()=>{
      if(scanStopped||video.readyState<2)return;
      try{const bc=await det.detect(video);if(bc.length>0)onBarcodeFound(bc[0].rawValue);}catch(e){}
    },200);
  }catch(e){
    if(e.name==='NotAllowedError')showToast('Permissão de câmera negada');
    else showToast('Câmera não disponível');
    setMode('scan-fallback');
  }
}
function stopScan(keepModal){
  scanStopped=true;
  if(scanTimer){clearInterval(scanTimer);scanTimer=null;}
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}
  document.getElementById('scanner-wrap').hidden=true;
  if(!keepModal)setMode('select');
}
async function onBarcodeFound(barcode){
  if(scanStopped)return;
  stopScan(true);setMode('loading');
  if(navigator.vibrate)navigator.vibrate(50);
  const product=await lookupOFF(barcode);
  if(product&&product.name){
    formData={name:product.name.substring(0,70),cat:product.cat||'outros',barcode,qty:'',notes:product.brand?`Marca: ${product.brand}`:''};
    showToast('Produto encontrado!');
  }else{
    formData={barcode,qty:''};
    showToast('Produto não encontrado. Preencha manualmente.');
  }
  addMode='form';rModal();
}
async function lookupOFF(barcode){
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}?fields=product_name,product_name_pt,brands,categories_tags`,{signal:ctrl.signal});
    clearTimeout(tid);
    if(!r.ok)return null;
    const data=await r.json();
    if(data.status!==1)return null;
    const p=data.product;
    return{name:(p.product_name_pt||p.product_name||'').trim(),brand:(p.brands||'').split(',')[0].trim(),cat:mapOFFCat(p.categories_tags||[])};
  }catch(e){return null;}
}
function mapOFFCat(tags){
  const t=tags.join(' ').toLowerCase();
  if(/water|agua|eau/.test(t))return'agua';
  if(/dairy|milk|leite|cream|cheese/.test(t))return'bebidas';
  if(/cereal|rice|pasta|bread|grain|flour|arroz|macarr/.test(t))return'graos';
  if(/fish|seafood|meat|tuna|sardine|chicken|atum|peixe/.test(t))return'proteina';
  if(/canned|conserve|preserved/.test(t))return'conserva';
  if(/hygiene|cleaning|beauty|soap/.test(t))return'higiene';
  if(/pharma|medicine|health|drug/.test(t))return'saude';
  if(/pet|dog|cat|animal/.test(t))return'pet';
  return'outros';
}
async function lookupManualEAN(){
  const input=document.getElementById('manual-ean');
  const status=document.getElementById('off-status');
  if(!input||!input.value.trim())return;
  const ean=input.value.trim();
  if(status)status.innerHTML='<span class="loading-spin"></span>Buscando...';
  const p=await lookupOFF(ean);
  if(p&&p.name){
    if(status)status.textContent=`✓ ${p.name}`;
    formData={name:p.name.substring(0,70),cat:p.cat||'outros',barcode:ean,qty:'',notes:p.brand?`Marca: ${p.brand}`:''};
    setTimeout(()=>{addMode='form';rModal();},700);
  }else{
    if(status)status.textContent='Produto não encontrado. Adicione manualmente.';
    formData={barcode:ean,qty:''};
  }
}
function startMiniScan(){
  closeAdd();
  setTimeout(async()=>{
    document.getElementById('modal-bg').classList.add('open');
    document.getElementById('modal-add').classList.add('open');
    addMode='loading';rModal();
    await tryStartScan();
  },350);
}

/* ---- EXPIRY CAMERA (lupa) ---- */
async function openExpiryCamera(){
  try{
    expiryCamStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}});
    const video=document.getElementById('expiry-video');
    video.srcObject=expiryCamStream;await video.play();
    const canvas=document.getElementById('expiry-canvas');
    canvas.hidden=true;video.hidden=false;
    const guide=document.getElementById('expiry-guide');
    if(guide)guide.style.display='block';
    document.getElementById('expiry-cam-label').textContent='Enquadre a data de validade';
    document.getElementById('expiry-cam-btns').innerHTML=`<button class="expiry-cam-btn cancel" onclick="closeExpiryCamera()">✕ Fechar</button><button class="expiry-cam-btn capture" onclick="captureExpiry()">📷 Congelar</button>`;
    document.getElementById('expiry-cam-wrap').hidden=false;
  }catch(e){
    if(e&&e.name==='NotAllowedError')showToast('Permissão de câmera negada');
    else showToast('Câmera não disponível');
  }
}
function captureExpiry(){
  const video=document.getElementById('expiry-video');
  const canvas=document.getElementById('expiry-canvas');
  canvas.width=video.videoWidth||640;
  canvas.height=video.videoHeight||480;
  canvas.getContext('2d').drawImage(video,0,0);
  if(expiryCamStream){expiryCamStream.getTracks().forEach(t=>t.stop());expiryCamStream=null;}
  video.hidden=true;canvas.hidden=false;
  const guide=document.getElementById('expiry-guide');
  if(guide)guide.style.display='none';
  document.getElementById('expiry-cam-label').textContent='';
  document.getElementById('expiry-cam-btns').innerHTML=`<button class="expiry-cam-btn close-cap" onclick="closeExpiryCamera()">✓ Fechar câmera</button>`;
}
function closeExpiryCamera(){
  if(expiryCamStream){expiryCamStream.getTracks().forEach(t=>t.stop());expiryCamStream=null;}
  document.getElementById('expiry-cam-wrap').hidden=true;
  const video=document.getElementById('expiry-video');
  video.hidden=false;
  document.getElementById('expiry-canvas').hidden=true;
}

/* ---- INIT ---- */
load();
go('dash');
</script>
